ns-serif">Team capacity and many services.</text><text x="751" y="534" font-size="21" font-weight="400" fill="#0f1a1c" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Focus, speed and accountability.</text><text x="1140" y="588" font-size="18" fill="#4a5a5e" text-anchor="end" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">ratulroy.com</text></svg>