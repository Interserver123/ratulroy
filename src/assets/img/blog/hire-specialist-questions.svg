<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 706" width="1200" height="706" role="img" aria-label="Five questions to ask before hiring an SEO specialist"><rect width="1200" height="706" rx="24" fill="#f4f7f6"/><rect x="1" y="1" width="1198" height="704" rx="23" fill="none" stroke="#d9e2e0" stroke-width="2"/><circle cx="64" cy="58" r="8" fill="#c8301d"/><text x="84" y="64" font-size="20" font-weight="700" fill="#c8301d" letter-spacing="2" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">HIRING GUIDE</text><text x="60" y="118" font-size="40" font-weight="800" fill="#0f1a1c" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Five questions to ask before hiring an SEO</text><text x="60" y="166" font-size="40" font-weight="800" fill="#0f1a1c" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">specialist</text><rect x="60" y="224" width="344" height="194" rx="16" fill="#ffffff" stroke="#d9e2e0" stroke-width="2"/><rect x="60" y="246" width="6" height="34" rx="3" fill="#c8301d"/><text x="84" y="270" font-size="28" font-weight="700" fill="#0f1a1c" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">What will you</text><text x="84" y="305" font-size="28" font-weight="700" fill="#0f1a1c" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">measure first?</text><text x="84" y="354" font-size="20" font-weight="400" fill="#4a5a5e" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Calls and direction</text><text x="84" y="381" font-size="20" font-weight="400" fill="#4a5a5e" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">requests, not only rankings.</text><rect x="428" y="224" width="344" height="194" rx="16" fill="#ffffff" stroke="#d9e2e0" stroke-width="2"/><rect x="428" y="246" width="6" height="34" rx="3" fill="#c8301d"/><text x="452" y="270" font-size="28" font-weight="700" fill="#0f1a1c" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Who does the work?</text><text x="452" y="313" font-size="20" font-weight="400" fill="#4a5a5e" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">The person you speak to, or</text><text x="452" y="340" font-size="20" font-weight="400" fill="#4a5a5e" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">a junior behind the scenes?</text><rect x="796" y="224" width="344" height="194" rx="16" fill="#ffffff" stroke="#d9e2e0" stroke-width="2"/><rect x="796" y="246" width="6" height="34" rx="3" fill="#c8301d"/><text x="820" y="270" font-size="28" font-weight="700" fill="#0f1a1c" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Can I verify your</text><text x="820" y="305" font-size="28" font-weight="700" fill="#0f1a1c" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">proof?</text><text x="820" y="354" font-size="20" font-weight="400" fill="#4a5a5e" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Screenshots with sources,</text><text x="820" y="381" font-size="20" font-weight="400" fill="#4a5a5e" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">clients you can contact.</text><rect x="60" y="442" width="344" height="194" rx="16" fill="#ffffff" stroke="#d9e2e0" stroke-width="2"/><rect x="60" y="464" width="6" height="34" rx="3" fill="#c8301d"/><text x="84" y="488" font-size="28" font-weight="700" fill="#0f1a1c" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">What does the</text><text x="84" y="523" font-size="28" font-weight="700" fill="#0f1a1c" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">contract say?</text><text x="84" y="572" font-size="20" font-weight="400" fill="#4a5a5e" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Notice period, deliverables,</text><text x="84" y="599" font-size="20" font-weight="400" fill="#4a5a5e" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">who owns the accounts.</text><rect x="428" y="442" width="344" height="194" rx="16" fill="#ffffff" stroke="#d9e2e0" stroke-width="2"/><rect x="428" y="464" width="6" height="34" rx="3" fill="#c8301d"/><text x="452" y="488" font-size="28" font-weight="700" fill="#0f1a1c" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Can you explain it</text><text x="452" y="523" font-size="28" font-weight="700" fill="#0f1a1c" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">plainly?</text><text x="452" y="572" font-size="20" font-weight="400" fill="#4a5a5e" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Jargon used to hide thin</text><text x="452" y="599" font-size="20" font-weight="400" fill="#4a5a5e" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">work is a warning sign.</text><text x="1140" y="678" font-size="18" fill="#4a5a5e" text-anchor="end" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">ratulroy.com</text></svg>