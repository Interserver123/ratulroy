faqs:
  - { q: "Does Local SEO work for all service businesses?", a: "Local SEO works best for businesses that serve a specific city, area, or region and depend on calls, appointments, bookings, or local leads." }
  - { q: "Is Google Maps ranking different for each industry?", a: "Yes. Different industries have different competition, categories, review expectations, urgency, service intent, and trust signals." }
  - { q: "Do emergency service businesses need a different strategy?", a: "Yes. Towing, plumbing, HVAC, electricians, and similar businesses need stronger mobile visibility, urgent-intent keywords, fast conversion paths, and service-area signals." }
  - { q: "Can healthcare and legal businesses use Local SEO?", a: "Yes, but they need stronger E-E-A-T, trust signals, accurate information, reviews, compliant content, and clear service pages." }
