intro:
  - "**Local SEO in Dhaka** means getting your business into the Google Maps three-pack and local results when people nearby search for what you sell. In practice it is a correctly categorised Google Business Profile, a pin on your real entrance, consistent addresses across the web, steady reviews and a website that loads on mobile data."
