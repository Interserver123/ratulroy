faqHeading: "Everything You Need to Know About SEO for Home Service Businesses"
faqs:
  - { q: "What is SEO for home service businesses and how does it work?", a: "It is Local SEO for trades that work at the customer's address. It combines Google Business Profile optimization, service-area pages, consistent citations, reviews and on-site SEO so people in your area find you on Google Maps and in \"near me\" searches, then call." }
  - { q: "Why hire a home services SEO specialist instead of doing it myself?", a: "You can do the basics yourself. A specialist already knows which categories fit each trade, how service-area businesses are ranked, which citations matter and how to write area pages that avoid doorway-page problems, so you skip months of guessing and fixing your own mistakes." }
  - { q: "How much does Local SEO for home service companies cost?", a: "Packages start from $299. The final price depends on your service area size, number of services and how competitive your trade is locally. You get a clear scope and price after the free audit, with no lock-in contract." }
  - { q: "How long until I see Google Maps ranking and lead growth?", a: "Most contractors see early movement in profile views, calls and direction requests within 30 to 60 days, and stronger Map Pack gains in 3 to 6 months. Competitive trades like HVAC, roofing and plumbing in big cities take longer; smaller areas often move faster." }
  - { q: "Can a service-area business rank without showing its address?", a: "Yes. A service-area business hides its address and lists up to 20 service areas. It still ranks mainly around its verified location, so wider coverage comes from reviews, area pages and prominence rather than from adding more areas." }
  - { q: "Do you build service-area pages for each city or neighbourhood?", a: "Yes, for the areas that matter most. Each page gets genuinely local content (jobs done there, response times, local problems), schema, internal links and a call button. Thin pages with only the town name swapped are a doorway-page risk, so I don't build those." }
  - { q: "Will this work for emergency keywords like \"24/7 plumber near me\"?", a: "It can, if the business genuinely offers it. Accurate hours (including 24-hour hours if true), emergency service pages and a phone that is answered are what earn those calls. Emergency searches convert well, so they get their own pages and tracking." }
  - { q: "How does Google Business Profile optimization fit into home service SEO?", a: "It is the biggest single lever. Your profile drives Map Pack ranking, calls and direction requests. Every engagement includes [GBP optimization](/google-business-profile-optimization): categories, services, service areas, photos, posts, review replies and ongoing maintenance, with calls and direction requests tracked in GBP Performance." }
  - { q: "What if I already have an SEO agency but rankings are stuck?", a: "That is common. Start with the free home service SEO audit. You'll see which profile settings, citations, area pages, technical issues and review gaps are holding you back, with a prioritized fix list you can run yourself or hand over." }
