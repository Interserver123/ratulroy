intro:
  - "**SEO for home services** is Local SEO for trades that work at the customer's address: plumbers, HVAC technicians, electricians, roofers, cleaners, pest control, movers and towing companies. It gets you into the Google Maps three-pack and local results for searches like \"plumber near me\" or \"AC repair open now\", then turns those searches into calls."
updated: 2026-10-21
sections:
  - type: problems
    eyebrow: The Problem
    heading: "Why do home service businesses struggle to rank locally?"
    intro: "Home services is one of the most crowded local search categories anywhere. If any of these sound familiar, calls are going to the contractor at the top of the map pack instead of you."
    items:
      - { title: "Your profile is verified but you're not in the 3-pack", text: "Usually a primary category that is too broad (\"Contractor\" instead of \"Plumber\"), an empty services list or too few recent reviews." }
      - { title: "Competitors with fewer reviews outrank you on Google Maps", text: "Distance and category relevance often beat review count. A competitor whose address sits closer to the searcher, with a tighter category, can win with half your reviews." }
      - { title: "The website gets traffic but few calls from your area", text: "Visitors arrive from the wrong towns, or land on a page with no phone number above the fold on mobile." }
      - { title: "Service-area pages are missing or near-duplicates", text: "Twenty city pages with the town name swapped look like doorway pages to Google and give nobody a reason to call." }
      - { title: "No real review system", text: "Happy customers forget to leave a review once the job is done and the technician has left." }
      - { title: "Past SEO agencies sent reports, not phone calls", text: "Ranking screenshots for keywords nobody searches, with no call tracking to show what the work produced." }
  - type: cards
    alt: true
    columns: 4
    eyebrow: The Solution
    heading: "Local SEO for home service companies, built to generate calls"
    intro: "A focused Local SEO system for contractors, not a generic agency retainer. Everything connects back to one number: qualified phone calls from your service area."
    items:
      - { title: Google Maps ranking, text: "Map Pack visibility for the searches that bring calls: service plus city, service plus \"near me\", and emergency searches like \"24 hour plumber\"." }
      - { title: Google Business Profile, text: "Primary and additional categories, services, attributes, service areas, photos, posts and review replies set up for how Google ranks trades: relevance, distance and prominence." }
      - { title: Service-area pages, text: "A page per priority town or neighbourhood with real local detail (jobs done there, response times, local issues) so one website ranks across your area without doorway-page risk." }
      - { title: "Calls, not clicks", text: "Click-to-call buttons, a sticky mobile call bar, emergency messaging and call tracking, so rankings turn into calls you can count." }
  - type: cards
    columns: 2
    eyebrow: Trades I work with
    heading: "Local SEO for each home service trade"
    intro: "Every trade searches differently. Emergency trades live on \"near me\" and \"open now\" searches at all hours; project trades like roofing and construction get fewer, larger enquiries researched over weeks. Each page below covers the categories, schema type and search terms for that trade."
    items:
      - { title: HVAC, href: /industries/hvac-seo, cta: Our HVAC SEO approach, text: "AC repair, AC servicing, installation, gas refill and duct cleaning searches, with seasonal demand peaks. GBP categories like HVAC contractor and Air conditioning repair service; schema type HVACBusiness." }
      - { title: Plumbing, href: /industries/plumbing-seo, cta: SEO for plumbers, text: "Burst pipes, blocked drains and water heater repair, where emergency and same-day searches drive most calls. GBP category Plumber; schema type Plumber." }
      - { title: Roofing, href: /industries/roofing-seo, cta: Roofing contractor SEO, text: "Roof repair, replacement and storm damage enquiries, where photos of finished jobs and reviews carry big tickets. GBP category Roofing contractor; schema type RoofingContractor." }
      - { title: Electrical, href: /industries/electrician-seo, cta: Electrician SEO, text: "Fault finding, rewiring, panel upgrades and emergency electricians, where licensing and trust signals matter. GBP category Electrician; schema type Electrician." }
      - { title: Cleaning, href: /industries/cleaning-seo, cta: Cleaning company SEO, text: "House cleaning, deep cleaning and move-out cleans, often run as a service-area business with no public address. GBP category House cleaning service." }
      - { title: Pest control, href: /industries/pest-control-seo, cta: Pest control SEO, text: "Termites, cockroaches, bed bugs and rodents, where urgent searches and repeat contracts both count. GBP category Pest control service." }
      - { title: Moving, href: /industries/moving-seo, cta: Moving company SEO, text: "House moves, office moves and packing services, where buyers compare quotes days ahead. GBP category Moving company; schema type MovingCompany." }
      - { title: Towing, href: /industries/towing-seo, cta: Towing company SEO, text: "Roadside assistance, flatbed towing, jump starts and lockouts, searched from the roadside on a phone at any hour. GBP category Towing service." }
      - { title: General contractors, href: /industries/contractor-seo, cta: General contractor SEO, text: "Renovations, extensions and remodels, where a portfolio of real projects and clear service pages win the shortlist. GBP category General contractor; schema type GeneralContractor." }
      - { title: Construction, href: /industries/construction-seo, cta: Construction company SEO, text: "Commercial and residential builds with long sales cycles, where project pages and reputation do the selling. GBP category Construction company." }
    body:
      - "Not a home service trade? See [Local SEO for every industry I work with](/industries)."
  - type: cards
    alt: true
    columns: 2
    eyebrow: Services
    heading: "What's inside the home service SEO system"
    intro: "Each piece feeds Google Maps ranking and qualified calls. Together they make up the [Local SEO service](/local-seo-service), adjusted for trades."
    items:
      - { title: Google Business Profile Optimization, text: "Categories, services, attributes, service areas (up to 20 for a service-area business with the address hidden), photos of real jobs, posts and review replies, plus ongoing maintenance and suggested-edit monitoring.", href: /google-business-profile-optimization }
      - { title: Google Maps ranking, text: "Geo-grid tracking across your service area to see where you rank street by street, then work on relevance and prominence for the gaps." }
      - { title: Service-area page SEO, text: "Unique pages for each priority town or neighbourhood, with LocalBusiness and Service schema, internal links and a clear call to action." }
      - { title: "Citation cleanup and local listings", text: "Consistent name, address and phone across Bing Places, Apple Business Connect, Facebook, trade directories and data aggregators, with duplicate listings merged or removed." }
      - { title: Review strategy for contractors, text: "A review request link or QR code the technician sends after each job, reply templates, and a steady pace of new reviews. No incentives, no review gating." }
      - { title: Technical SEO, text: "Core Web Vitals (LCP, INP, CLS), mobile speed, crawlability and schema (LocalBusiness subtypes, Service, FAQPage) for contractor sites.", href: /technical-seo }
      - { title: Content strategy, text: "Service pages, area pages, emergency pages and practical guides that answer cost, timing and \"should I repair or replace\" questions." }
      - { title: Conversion and call tracking, text: "Click-to-call buttons, sticky mobile call bars, trust blocks and tracked numbers, so you see which pages and areas produce booked jobs." }
