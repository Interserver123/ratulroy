intro:
  - "These case studies document SEO projects I ran for local service businesses, an e-commerce store and content publishers. Across all my client work I have generated 1.4M+ organic clicks and 68M+ search impressions; these five projects show the method behind the numbers. Every figure comes from a source screenshot (Google Business Profile Performance, Google Search Console, Shopify, Semrush or Ahrefs), not a designed report."
sections:
  - type: prose
    alt: true
    eyebrow: How to Read These
    heading: "How to read these case studies"
    intro: "Each one follows the same structure: the problem, the method, the result and the raw screenshots. Here is what to look for."
    blocks:
      - heading: "Look at the shape of the growth curve"
        body:
          - "Every case study here is a real project, with real Google Search Console screenshots, real Semrush and Ahrefs exports, and real before-and-after metrics. No mocked dashboards, no inflated numbers. The point is to show, concretely, what compounding Local SEO and organic growth looks like over 6 to 18 months."
          - "Pay attention to the shape of the curve, not just the final number. Sustainable SEO almost never goes vertical in week one. What you want to see is a steady upward slope where each month is better than the last. That happens when the technical foundation, the content and the prominence signals (reviews, links, citations) all improve together."
      - heading: "Which case study matches your business?"
        bullets:
          - "**Local service business, Google Business Profile:** [461 calls from a rebuilt profile](/case-studies/gbp-calls-growth), produced by [Google Business Profile optimization](/google-business-profile-optimization)."
          - "**Service-area business, Google Maps coverage:** [geo-grid tracking across nearby service areas](/case-studies/map-pack-service-areas), the method behind my [Local SEO service](/local-seo-service)."
          - "**E-commerce, Shopify:** [Hamper Story's $72,412 monthly sales](/case-studies/hamper-story) from 16 months of organic SEO."
          - "**Tech media publisher:** [TechicTalk's 976K organic clicks](/case-studies/techictalk-organic-growth) from topic clusters and authority building."
          - "**Website SEO from near zero:** [3.93K clicks in 6 months](/case-studies/data-driven-organic-growth) through [technical SEO](/technical-seo) and content fixes."
      - heading: "What these projects have in common"
        body:
          - "Every project started with a full audit, a clear strategy and a written 90-day plan. None used black-hat tactics, link farms or AI-spam content. The wins came from fundamentals done every week: keyword and intent mapping, on-page and technical SEO, schema, content depth, prominence signals and patient measurement."
          - "If you run a trade, the [home services SEO page](/seo-for-home-services) shows how this applies to HVAC, plumbing, roofing and similar businesses. For a realistic sense of timelines before you start, read [how long Local SEO takes](/blog/how-long-local-seo-takes-bangladesh)."
