faqHeading: "Everything You Need to Know About Results & Case Studies"
faqs:
  - { q: "Are these results typical?", a: "No result is typical, and anyone claiming otherwise is guessing. Outcomes depend on competition in your area, the state of your profile and website, your review base and how long the business has been established. These case studies show what the work produced in those specific situations." }
  - { q: "How long did these results take?", a: "Each case study states its own timeframe: 5 months of call data for the GBP project, 6 months for the website SEO project, 16 months for Hamper Story and 18 months for TechicTalk. Local SEO usually shows measurable movement in 3 to 6 months, with compounding gains after that." }
  - { q: "Why are the numbers screenshots rather than a report?", a: "The figures come straight from Google Search Console, Google Business Profile Performance and the client platforms involved. Screenshots from the source are harder to massage than a designed report, so you can check the dates and metrics yourself." }
  - { q: "Can you guarantee the same results for my business?", a: "No. Google states there is no way to pay for or request a better local ranking, so any guarantee is a red flag. What I can promise is a clear plan, white-hat work, monthly reporting and no lock-in contract." }
  - { q: "Can I speak to a past client?", a: "Client references can be arranged where the client has agreed to it. Ask on a strategy call and it will be handled directly rather than published on the site." }
  - { q: "My industry is not shown here. Does that matter?", a: "Not much. The factors behind Map Pack visibility (relevance, distance and prominence) are the same across local service industries. The competition level and search language differ, and the [industry pages](/industries) cover how the approach adapts." }
