          - "**Google Business Profile:** categories, services, posts, photos, Q&A, products, attributes."
          - "**Website SEO:** on-page, content, internal linking, semantic SEO, and topical authority."
          - "**Technical SEO:** Core Web Vitals, crawlability, indexation, schema markup, and structured data."
