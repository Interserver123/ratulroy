intro:
  - "**Generative Engine Optimization (GEO)** is the work of making a business easy for AI answer engines to identify, verify and cite. In practice that means one consistent entity across your website, Google Business Profile and directories, schema.org markup that ties them together, pages that answer buyer questions directly, and reviews and mentions an assistant can confirm."
  - "I don't start with content. I start by recording what the assistants say about you today, which sources they cite, and where the facts about your business disagree. Most lost AI mentions trace back to a small number of fixable mismatches."
