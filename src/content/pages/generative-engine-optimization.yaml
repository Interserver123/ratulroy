sections:
  - type: cards
    columns: 2
    eyebrow: What is GEO?
    heading: "How GEO differs from traditional SEO"
    intro: "Traditional SEO earns a position in a list of links. GEO earns a mention inside a written answer. The two share a foundation (crawlable pages, clear content, links and reviews), but an AI answer adds a step: the system has to be confident about which real business it is describing before it names you."
    items:
      - { label: Then, title: Traditional SEO, bullets: ["Rankings in the organic results", "Clicks from a results page", "Title tags and snippets", "Keyword-led pages", "Traffic as the main measure"] }
      - { label: Now, title: Generative Engine Optimization, featured: true, bullets: ["Mentions inside AI-written answers", "Entity recognition: who, what, where", "Citations to your pages as sources", "Brand mentions on third-party sites", "Answers that survive follow-up questions", "Visibility in AI Overviews"] }
  - type: cards
    alt: true
    columns: 4
    eyebrow: Why it matters
    heading: "Where AI answers get their information about your business"
    intro: "Each assistant builds its answer from different sources. Google AI Overviews and Gemini lean on Google's own index, Google Maps data and the Knowledge Graph. Bing Copilot draws on Bing's index and Bing Places. ChatGPT search and Perplexity run live web searches and cite the pages they read. One inconsistent fact in any of those places weakens the whole picture."
    items:
      - { title: Fewer clicks reach your site, text: "An AI Overview often answers the question on the results page. If your business is named in that answer, you still win the call. If it is not, the click never existed." }
      - { title: Entities beat keywords, text: "Assistants reason about things, not strings. Your business name, address, phone, founder, services and service area need to match everywhere so they resolve to one entity." }
      - { title: Third-party proof counts, text: "AI systems prefer facts they can confirm elsewhere: reviews, directory listings, press, association pages and industry sites that mention you by name." }
      - { title: Local and AI search share signals, text: "Your Google Business Profile, reviews and citations feed both the Map Pack and AI answers to local questions. Weak local foundations show up in both places." }
  - type: list
    eyebrow: Local GEO
    heading: "How AI answers \"best X near me\" questions"
    body:
      - "Ask Gemini or an AI Overview for \"the best pediatric dentist near me\" and the answer is usually assembled from Google Maps listings, review text, the businesses' own websites and a few list articles. That means the same signals behind [Local SEO services](/local-seo-service) decide who gets named: distance from the searcher, how relevant your categories and services are, and how prominent your business looks across the web."
      - "Review text matters more than most owners expect. When customers write \"they fixed our AC the same evening\" or \"the root canal was painless\", an assistant can quote that as a reason to recommend you. A profile with a correct primary category, a full services list and recent reviews gives an AI system concrete things to say, which is why [Google Business Profile optimization](/google-business-profile-optimization) is usually the first GEO task for a local business."
    bullets: ["Google Business Profile categories and services", "Review recency and what reviews actually say", "NAP consistency across directories", "LocalBusiness schema with areaServed and sameAs", "Service and area pages that answer real questions", "Bing Places and Apple Business Connect listings", "Mentions in local news and list articles", "Owner replies that add useful detail"]
  - type: cards
    columns: 3
    eyebrow: Who needs GEO?
    heading: "Which businesses benefit most from GEO?"
    items:
      - { label: "01", title: Local service businesses, text: "Clinics, trades, law firms and repair shops that want to be named when people ask an assistant for a provider in their city or area." }
      - { label: "02", title: SEO agencies, text: "Agencies that need entity, schema and AI visibility work delivered for their clients under their own process." }
      - { label: "03", title: Consultants and experts, text: "Personal brands that need AI systems to connect their name with their expertise, credentials and published work." }
      - { label: "04", title: SaaS and B2B brands, text: "Companies that appear in comparison and \"which tool should I use\" prompts, where being described accurately matters as much as being mentioned." }
      - { label: "05", title: "Healthcare, legal and professional services", text: "Trust-heavy fields where AI systems are cautious, so author credentials, accurate claims and verifiable proof carry extra weight. See how this applies to [dental clinics](/industries/dental-seo)." }
      - { label: "06", title: "Not sure yet?", href: "/#free-audit", cta: Get an AI visibility audit, text: "Start with an audit of how AI platforms currently describe your business, then decide." }
  - type: cards
    alt: true
    columns: 2
    eyebrow: GEO service stack
    heading: "What's included in my Generative Engine Optimization service"
    items:
      - { title: AI Search Visibility Audit, text: "I run the prompts your buyers would use in AI Overviews, Gemini, ChatGPT search, Perplexity and Bing Copilot, then record whether you are named, how you are described and which sources get cited instead.", tags: ["AI visibility audit", "Prompt testing", "Source mapping"] }
      - { title: Entity SEO, text: "I make one clear version of your business: the same name, address, phone, founder, services and area on your website, Google Business Profile, social profiles and directories, so systems resolve them to one entity.", tags: ["Entity consistency", "Knowledge Graph", "Brand entity"] }
      - { title: "Schema and structured data", text: "I add JSON-LD for Organization or LocalBusiness (with the right subtype), Person, Service, FAQPage, Article and BreadcrumbList, including sameAs links that tie your site to your other profiles.", tags: ["Schema markup", "sameAs", "JSON-LD"] }
      - { title: AI Overview readiness, text: "I restructure key pages so each one opens with a direct answer, uses specific headings and covers the follow-up questions a searcher asks next.", tags: ["AI Overviews", "Answer-first pages", "Question headings"] }
      - { title: LLM citation work, text: "I improve the pages an assistant is most likely to cite: clear facts, named services, prices or ranges where you publish them, and claims backed by evidence on the page.", tags: ["LLM citations", "ChatGPT search", "Perplexity"] }
      - { title: Topical coverage mapping, text: "I map the questions buyers ask around each service and build supporting pages, so your site covers the topic rather than one keyword.", tags: ["Topical authority", "Semantic SEO", "Content clusters"] }
      - { title: "Query fan-out coverage", text: "AI systems split one question into several sub-searches. I check which of those sub-questions your site answers and fill the gaps with comparison, cost and how-to content.", tags: ["Query fan-out", "Follow-up prompts", "Answer engine optimization"] }
      - { title: "Brand mentions and citations", text: "I clean up directory listings and build mentions on sites assistants trust: industry directories, associations, local media and partner pages. More on the groundwork in this [guide to local citations and NAP consistency](/blog/local-citations-nap-consistency-guide).", tags: ["Brand mentions", "Citation signals", "NAP consistency"] }
      - { title: "E-E-A-T and trust signals", text: "I strengthen author pages, credentials, case studies, review display and the About page, so a cautious AI system has evidence to rely on.", tags: ["E-E-A-T", "Author signals", "Proof"] }
      - { title: "GEO reporting and next steps", text: "Each month you see which prompts name you, which sources get cited, what changed in schema and entity coverage, and what I am fixing next.", tags: ["GEO reporting", "Prompt tracking", "Roadmap"] }
  - type: cards
