sections:
  - type: cards
    columns: 2
    eyebrow: GEO vs SEO
    heading: "How GEO differs from traditional SEO"
    intro: "SEO earns a position in a list of links; GEO earns a named mention inside a written answer. Both need crawlable pages and trust, but an assistant must also be certain which real business it is describing before it names you. That certainty is what I build."
    items:
      - { label: Then, title: Traditional SEO, bullets: ["Rankings in the organic results", "Clicks from a results page", "Title tags and snippets", "Keyword-led pages", "Traffic as the main measure"] }
      - { label: Now, title: Generative Engine Optimization, featured: true, bullets: ["Named in AI-written answers", "One verified entity: who, what, where", "Your pages cited as sources", "Facts confirmed on third-party sites", "Answers that hold up to follow-up questions", "Visibility in AI Overviews"] }
  - type: cards
    alt: true
    columns: 4
    eyebrow: Where answers come from
    heading: "Where AI answers get their information about your business"
    intro: "Google AI Overviews and Gemini read Google's index, Maps data and the Knowledge Graph; Bing Copilot reads Bing and Bing Places; ChatGPT search and Perplexity run live web searches. I audit all of those sources, because one wrong phone number or category in any of them weakens the whole picture."
    items:
      - { title: Fewer clicks reach your site, text: "An AI Overview often answers on the results page. If you are named in it, you still get the call. If you are not, there was never a click to win." }
      - { title: Entities beat keywords, text: "Assistants reason about things, not strings. I match your name, address, phone, founder, services and service area across every profile so they resolve to one business." }
      - { title: Third-party proof counts, text: "Assistants prefer facts they can confirm elsewhere. I build that corroboration on directories, associations, local media and partner pages." }
      - { title: Maps and AI share signals, text: "Your Google Business Profile, reviews and citations feed both the Map Pack and AI answers to local questions. That is why I fix them first." }
  - type: list
    eyebrow: Local GEO
    heading: "How AI answers \"best X near me\" questions"
    intro: "For local questions, AI answers are built mostly from Google Maps listings, review text and the businesses' own sites, so the business that ranks across the most of its service area gets named most. I measure that with geo-grid tracking rather than a single rank check from one postcode."
    body:
      - "A geo-grid scan checks the same keyword from a grid of points across your service area and shows each position on a map. For a home service business near Plano, that view showed it ranked in one zone and nowhere else. After category, service-area and citation work it ranked Top 3 across five times as many areas, with Map Pack visibility up 38% ([the full case study](/case-studies/map-pack-service-areas))."
      - "On each grid I compare your primary and secondary categories with the competitors who outrank you. Where a competitor has stuffed keywords into its business name or runs a fake listing, I report it to Google with evidence, because those listings take places that belong to real businesses. Then I line up your service and area pages with the profile, using LocalBusiness JSON-LD with areaServed and sameAs, so Google and the assistants read one consistent story."
      - "Review text matters more than most owners expect. When a customer writes \"they fixed our AC the same evening\", an assistant can quote it as a reason to recommend you. That is why [Google Business Profile optimization](/google-business-profile-optimization) is usually the first GEO task for a local business."
    bullets: ["Primary and secondary categories vs the competitors who outrank you", "Geo-grid rank tracking across the whole service area", "Spam and keyword-stuffed listings reported with evidence", "NAP matched across every directory", "LocalBusiness JSON-LD with areaServed and sameAs", "Service and area pages aligned with the profile", "Bing Places and Apple Business Connect listings", "Review requests that prompt specific detail"]
  - type: cards
    columns: 3
    eyebrow: Who it's for
    heading: "Which businesses benefit most from GEO?"
    intro: "GEO pays back fastest for businesses where one recommended enquiry is worth a lot: high-ticket trades, B2B suppliers and trust-heavy services. I work with clients in the US and abroad and with market leaders in Bangladesh. The method is the same; the platforms and sources differ by market."
    items:
      - { label: "01", title: "HVAC, plumbing and electrical", text: "Emergency and high-value jobs where buyers ask an assistant \"who can fix this today\". I work on Maps coverage and AI mentions together. See [HVAC SEO](/industries/hvac-seo), [plumbing SEO](/industries/plumbing-seo) and [Local SEO for electricians](/industries/local-seo-for-electricians)." }
      - { label: "02", title: Wholesale distributors, text: "B2B buyers ask assistants for suppliers by product, brand and region. I make your catalogue, brands and coverage area clear enough to be named. See [SEO for wholesale distributors](/seo-for-wholesale-distributors)." }
      - { label: "03", title: "Leading local businesses in Bangladesh", text: "In Bangladesh, addresses are written many ways and Bangla and English searches mix. I standardise your entity across Google, Facebook and local directories so assistants stop confusing you with similar names." }
      - { label: "04", title: "Clinics and professional services", text: "AI systems are cautious in health and legal topics. Named experts, verifiable credentials and real reviews carry extra weight. See how this applies to [dental clinics](/industries/dental-seo)." }
      - { label: "05", title: Consultants and SEO agencies, text: "Personal brands that need AI systems to connect a name with expertise, and agencies that need entity and schema work delivered for their clients." }
      - { label: "06", title: "Not sure yet?", href: "/#free-audit", cta: Get an AI visibility audit, text: "Start with an audit of what the assistants say about you today, then decide." }
  - type: cards
    alt: true
    columns: 2
    eyebrow: What I do
    heading: "What's included in my Generative Engine Optimization service"
    intro: "Each part of the service fixes one reason an assistant might skip you: it can't find you, can't verify you, or can't find a quotable answer on your pages. You get the diagnosis first, then the fixes in order of impact."
    items:
      - { title: AI search visibility audit, text: "I run the prompts your buyers use across AI Overviews, Gemini, ChatGPT search, Perplexity and Bing Copilot, and log three things for each: are you named, how are you described, and which sources were cited instead.", tags: ["Prompt testing", "Source mapping", "Competitor citations"] }
      - { title: Entity audit and clean-up, text: "I list every place your business appears and flag each mismatch in name, address, phone, category or description. Duplicate and outdated listings get merged or closed.", tags: ["Entity consistency", "Knowledge Graph", "Duplicate listings"] }
      - { title: "Schema and structured data", text: "I write JSON-LD for LocalBusiness (with the right subtype), Person, Service, FAQPage and BreadcrumbList, joined in one graph with sameAs links to your real profiles. I validate it before it goes live.", tags: ["JSON-LD", "sameAs", "LocalBusiness"] }
      - { title: Search Console and SERP auditing, text: "I pull your Google Search Console queries and check the live results for the ones that trigger AI Overviews. That shows which of your pages Google already trusts, and which questions you are losing.", tags: ["Search Console", "AI Overview queries", "SERP audit"] }
      - { title: Answer-first pages, text: "I rewrite priority pages so each section opens with a direct, quotable answer, followed by the detail and proof. Assistants lift those first sentences.", tags: ["AI Overviews", "Answer-first", "Question headings"] }
      - { title: "Query fan-out coverage", text: "Assistants split one question into several sub-searches. I map those sub-questions (cost, comparison, timing, risk) and fill the gaps on your site.", tags: ["Query fan-out", "Follow-up prompts", "Topical coverage"] }
      - { title: "Brand mentions and citations", text: "I fix directory listings and earn mentions on sites assistants trust: industry directories, associations, local media and partner pages. Groundwork in this [guide to local citations and NAP consistency](/blog/local-citations-nap-consistency-guide).", tags: ["Brand mentions", "Citations", "NAP"] }
      - { title: "Proof and trust signals", text: "Named author, credentials, case studies with real numbers, and reviews shown on the page. A cautious assistant needs evidence it can point to.", tags: ["E-E-A-T", "Author signals", "Case studies"] }
      - { title: Crawler access check, text: "I check robots.txt, CDN and security settings for blocks on OAI-SearchBot, PerplexityBot, Bingbot and Googlebot. Accidental blocks are common and quick to fix.", tags: ["robots.txt", "AI crawlers", "Technical SEO"] }
      - { title: "Monthly prompt tracking", text: "Each month I re-run the same prompts and report which name you, which sources were cited, what changed and what I am fixing next. Enquiries are reported alongside mentions.", tags: ["Prompt tracking", "Reporting", "Roadmap"] }
  - type: cards
    columns: 4
    eyebrow: The framework
    heading: "Four levels from basic AI readiness to strong LLM visibility"
    intro: "Most businesses I audit stop at Level 1 or 2: the site can be crawled, but the entity is inconsistent and the pages don't answer questions directly. Each level depends on the one before it, so I fix them in order."
    items:
      - { label: Level 1, title: Foundation, bullets: ["Crawlable, indexable pages", "AI crawlers allowed in robots.txt", "Clear service pages", "Basic schema", "Consistent brand name"] }
      - { label: Level 2, title: Entity clarity, bullets: ["LocalBusiness or Organization schema", "sameAs links to real profiles", "A detailed About page", "Matching NAP everywhere", "Named author and expert"] }
      - { label: Level 3, title: Answer-ready pages, bullets: ["Answer-first sections", "Question-form headings", "Cost and comparison content", "Problem and solution pages", "FAQs that add new information"] }
      - { label: Level 4, title: Strong LLM visibility, featured: true, bullets: ["Full topical coverage", "Query fan-out coverage", "Citable facts and proof", "Mentions on trusted sites", "Reviews that describe the work", "Monthly prompt tracking"] }
  - type: steps
    id: geo-process
    alt: true
    eyebrow: Process
    heading: "My GEO process, step by step"
    intro: "The process runs in six steps, from a recorded baseline to monthly tracking against it. Nothing is changed before the baseline exists, so every result can be measured."
    items:
      - { title: Baseline prompt audit, text: "I run your buyer prompts across five AI platforms and save the answers and cited sources. This is the baseline every later report is measured against." }
      - { title: Entity and geo-grid mapping, text: "I map every listing and profile, flag mismatches, and run geo-grid scans for your main services to see where you rank across the service area." }
      - { title: Search Console and content gaps, text: "I compare your Search Console queries and AI Overview results with the questions buyers ask, and list the missing pages and answers." }
      - { title: Schema and technical fixes, text: "I implement structured data, fix internal links and remove crawl blocks. Where the site itself is the problem, the [technical SEO service](/technical-seo) covers indexing, speed and rendering." }
      - { title: Answer-ready content, text: "I rewrite priority pages to open with direct answers and add the facts and proof an assistant can quote." }
      - { title: Monthly tracking, text: "I re-run the same prompts and grids each month, report what changed, and pick the next fixes. You can stop at any time; there is no lock-in contract." }
  - type: cards
    columns: 3
    eyebrow: Why Ratul Roy
    heading: "Why work with Ratul Roy for GEO and AI search optimization?"
    intro: "I've spent 5+ years ranking businesses in Google Maps and organic search, and GEO uses the same data. My results include 461 calls from one Business Profile, +38% Map Pack visibility and a tech site grown from zero to [976K Google clicks](/case-studies/techictalk-organic-growth)."
    items:
      - { title: "Maps and AI together", text: "For local businesses, the Map Pack and AI answers draw on the same profile, reviews and citations. I work on both at once rather than paying twice for overlapping work." }
      - { title: Entity first, text: "I start with one consistent entity: schema, citations, service pages and profiles. No prompt tricks." }
      - { title: Measured, not guessed, text: "Geo-grid scans, Search Console data and saved prompt results. Every report shows the screenshots behind the numbers." }
      - { title: White-hat only, text: "No fake reviews, no keyword-stuffed business names, no private link networks. These get listings suspended, and assistants learn to distrust them." }
      - { title: Honest about limits, text: "Nobody controls what an AI says, and answers change often. I report what I can measure and say plainly what I can't." }
      - { title: You work with me, text: "No account managers and no lock-in. You talk to the person doing the work, from $299." }
  - type: steps
    eyebrow: AI discovery preview
    heading: "How an AI system decides to recommend a business"
    intro: "An assistant names a business when several independent sources agree on who it is and what it does. A simplified view of a query like *best AC repair near me* follows; it is not a live result or a ranking guarantee."
    items:
      - { title: It searches and reads pages, text: "The assistant runs one or more searches and reads the top sources, including your site if it can crawl it." }
      - { title: It resolves the entity, text: "It matches names, addresses and profiles to decide which real business each source describes." }
      - { title: It checks corroboration, text: "It looks for the same facts in reviews, directories and third-party pages before trusting them." }
      - { title: It matches services to the question, text: "It checks whether your pages clearly offer what was asked, in the area that was asked about." }
      - { title: It writes the answer, text: "It names the businesses it is most confident about and often links the pages it relied on." }
    body:
      - "For a practical walkthrough for small businesses, read [how to get your local business cited by ChatGPT and Gemini](/blog/ai-search-visibility-local-business)."
