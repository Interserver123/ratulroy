faqHeading: "Frequently Asked Questions About Generative Engine Optimization"
faqs:
  - { q: "What is GEO in SEO?", a: "GEO stands for Generative Engine Optimization: making your business easy for AI answer engines such as Google AI Overviews, Gemini, ChatGPT search and Perplexity to identify, trust and cite. The main levers are a consistent entity, structured data, answer-first pages and third-party mentions." }
  - { q: "Is GEO different from SEO?", a: "GEO builds on SEO rather than replacing it. Rankings, crawlable pages and links still matter. GEO adds entity consistency, schema, citable facts and brand mentions, because an assistant needs to be sure which business it is describing before it names it." }
  - { q: "Can you guarantee that ChatGPT or Perplexity will recommend my business?", a: "No. Nobody controls what AI platforms say, and answers change from day to day. I improve the signals those systems rely on and report honestly which prompts name you and which do not." }
  - { q: "How do you measure GEO results?", a: "I save a baseline of buyer prompts and cited sources before changing anything, then re-run the same prompts monthly. For local businesses I add geo-grid rank scans and Search Console data, and report enquiries alongside mentions." }
  - { q: "How do AI tools choose businesses for \"near me\" questions?", a: "Mostly from local data. Google AI Overviews and Gemini use Google Maps listings and reviews, Bing Copilot uses Bing Places, and ChatGPT search and Perplexity use the web pages they find. Consistent listings, strong reviews and clear service pages help in all of them." }
  - { q: "Does my Google Business Profile affect AI answers?", a: "Yes. For local questions it is one of the strongest inputs. Your categories, services, hours, review count and the words customers use in reviews all give Google's AI something specific to say about you." }
  - { q: "Does GEO work for businesses outside Bangladesh?", a: "Yes. The assistants check the same things in every market: who you are, what you do and where. I work with home service businesses and distributors in the US and abroad as well as local businesses in Bangladesh." }
  - { q: "Should I block AI crawlers in robots.txt?", a: "Not if you want AI visibility. Blocking OAI-SearchBot or PerplexityBot stops those tools reading your pages for their answers. Many sites block them by accident through a security plugin or CDN setting, so it is one of the first things I check." }
  - { q: "How long does GEO take?", a: "Schema, crawler access and listing fixes take weeks. Being named consistently takes months, because it depends on reviews, mentions and content building up, and on how often each platform refreshes what it knows." }
