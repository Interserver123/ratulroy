    bullets: ["Baseline prompt audit with saved answers and cited sources", "Entity mismatch report", "Geo-grid scans for your main services", "Search Console and AI Overview query review", "Schema implemented and validated", "Content gap map", "Answer-first rewrites of priority pages", "Citation and mention targets", "Crawler access check", "Monthly report: prompts, sources, grids and enquiries"]
