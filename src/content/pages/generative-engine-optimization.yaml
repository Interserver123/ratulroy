  - type: steps
    id: geo-process
    alt: true
    eyebrow: Process
    heading: "My GEO process, step by step"
    items:
      - { title: AI search discovery audit, text: "I test buyer prompts across Google AI Overviews, Gemini, ChatGPT search, Perplexity and Bing Copilot, and note who gets named and which pages get cited." }
      - { title: Entity and trust signal mapping, text: "I list every place your business appears (website, Google Business Profile, Bing Places, social profiles, directories, press) and flag each mismatch in name, address, phone or description." }
      - { title: Content and intent gap analysis, text: "I compare the questions buyers ask with the pages you have, and find the missing service, cost, comparison and FAQ content." }
      - { title: Schema and technical fixes, text: "I implement structured data, fix internal links and remove crawl blocks. Where the site itself is the problem, the [technical SEO service](/technical-seo) handles indexing, speed and rendering." }
      - { title: Answer-ready content, text: "I rewrite priority pages to open with direct answers, use specific headings and include facts an assistant can quote." }
      - { title: Monitoring and iteration, text: "I re-run the same prompts each month, track mentions and cited sources, and adjust what to fix next." }
  - type: cards
    columns: 3
    eyebrow: Why Ratul Roy
    heading: "Why work with Ratul Roy for GEO and AI search optimization?"
    intro: "GEO is not a separate discipline from SEO. It sits on the same Local SEO, technical SEO, entity and content work I already do for service businesses, the work behind organic results like the [TechicTalk growth to 976K clicks](/case-studies/techictalk-organic-growth). The difference is the extra attention to how machines read and verify a business."
    items:
      - { title: "Local SEO and GEO together", text: "I work on Google Maps visibility and AI answers at the same time, because for local businesses they draw on the same data." }
      - { title: Entity-first thinking, text: "I start with a consistent entity (schema, citations, service pages, social profiles), not with prompts or tricks." }
      - { title: Technical foundation, text: "AI crawlers need fast, crawlable, well-structured pages. I fix those before writing anything new." }
      - { title: Content for people first, text: "Pages that answer buyers' questions clearly are also the pages AI systems cite. I write for the buyer and structure for the machine." }
      - { title: Honest about uncertainty, text: "AI answers change often and nobody controls them. I report what I can measure and say plainly what I cannot." }
      - { title: Measured in enquiries, text: "Visibility only matters if it brings calls, bookings and qualified leads, so that is what I report on alongside mentions." }
  - type: steps
    eyebrow: AI discovery preview
    heading: "How an AI system decides to recommend a business"
    intro: "A simplified picture for a query like *best GEO expert in Bangladesh*. It is not a live platform result or a ranking guarantee."
    items:
      - { title: It searches and reads pages, text: "The assistant runs one or more searches and reads the top sources, including your site if it can crawl it." }
      - { title: It resolves the entity, text: "It matches names, addresses and profiles to decide which real business each source is talking about." }
      - { title: It checks corroboration, text: "It looks for the same facts on reviews, directories and third-party pages before trusting them." }
      - { title: It matches services to the question, text: "It checks whether your pages clearly offer what was asked, in the place that was asked about." }
      - { title: It writes the answer, text: "It names the businesses it is most confident about and often links the pages it relied on." }
    body:
      - "For a practical walkthrough of this process for small businesses, read [how to get your local business cited by ChatGPT and Gemini](/blog/ai-search-visibility-local-business)."
