faqHeading: "Frequently Asked Questions About Generative Engine Optimization"
faqs:
  - { q: "What is GEO in SEO?", a: "GEO stands for Generative Engine Optimization. It is the work of making your business easy for AI answer engines such as Google AI Overviews, Gemini, ChatGPT search and Perplexity to identify, trust and cite, using entity consistency, structured data, answer-ready content and third-party mentions." }
  - { q: "Is GEO different from SEO?", a: "Partly. GEO builds on SEO rather than replacing it. Rankings, crawlable pages and links still matter. GEO adds attention to entity consistency, schema, citable facts and brand mentions, because AI systems need to be sure which business they are describing before they name it." }
  - { q: "Can you guarantee that ChatGPT or Perplexity will recommend my business?", a: "No. Nobody controls what AI platforms say, and their answers change from one day to the next. GEO improves the signals those systems rely on, and I report honestly on which prompts name you and which do not." }
  - { q: "How do AI tools choose businesses for \"near me\" questions?", a: "Mostly from local data. Google AI Overviews and Gemini draw on Google Maps listings and reviews, Bing Copilot on Bing Places, and ChatGPT search and Perplexity on the web pages they find. Consistent listings, strong reviews and clear service pages help in all of them." }
  - { q: "Does my Google Business Profile affect AI answers?", a: "Yes, for local questions it is one of the strongest inputs. Your categories, services, hours, review count and the words customers use in reviews all give Google's AI systems something specific to say about you." }
  - { q: "What is the sameAs property and why does it matter?", a: "sameAs is a schema.org property that lists your other official profiles, such as your Facebook Page, LinkedIn and directory listings. It tells search engines these profiles belong to the same entity as your website, which helps them connect facts about you." }
  - { q: "Should I block AI crawlers in robots.txt?", a: "Not if you want AI visibility. Blocking crawlers such as OAI-SearchBot or PerplexityBot stops those tools from reading your pages for their search answers. Many sites block them by accident through a security plugin or CDN setting, so it is one of the first things I check." }
  - { q: "How long does GEO take?", a: "Fixes such as schema, unblocked crawlers and corrected listings can be done in weeks. Being named consistently takes longer, because it depends on reviews, mentions and content building up over months, and on how often each AI platform refreshes what it knows." }
