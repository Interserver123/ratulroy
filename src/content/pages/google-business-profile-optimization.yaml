      - { label: "03", title: "Reviews & reputation", text: "Request links, reply routines and monitoring. No incentives, no gating, no fake reviews.", tags: ["Review velocity", "Replies"] }
      - { label: "04", title: "Citations & NAP consistency", text: "Bing Places, Apple Business Connect, Facebook and directories, all with the same details. Why it matters: [citations and NAP consistency](/blog/local-citations-nap-consistency-guide).", tags: ["Citations", "NAP"] }
      - { label: "05", title: "Website pages that support Maps", text: "Service and location pages that confirm what the profile claims.", tags: ["On-page SEO", "Service pages"] }
      - { label: "06", title: "LocalBusiness schema & entity", text: "Structured data so Google and AI assistants read your business facts without guessing, handled as part of [technical SEO](/technical-seo).", tags: ["Schema", "Entity SEO"] }
      - { label: "07", title: "Photos & posts routine", text: "Real photos of your premises, team and work, and posts that keep the profile active.", tags: ["Photos", "Google Posts"] }
