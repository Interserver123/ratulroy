  - type: problems
    nav: Problems I fix
    id: problems
    alt: true
    eyebrow: Profile problems I fix
    heading: "Suspended, unverified, duplicated or hijacked? These get fixed first"
    intro: "Optimizing a profile that has one of these problems is wasted effort, so they are always handled before anything else. If you can't find your business on Maps at all, start with [why a business is not showing on Google Maps](/blog/why-my-business-not-showing-google-maps)."
    items:
      - { title: Suspension & reinstatement, text: "The cause found (usually a keyword-stuffed name, a virtual office or a wrong service-area setup), corrected, and the appeal filed with the evidence Google asks for. Nobody can guarantee reinstatement." }
      - { title: "Verification, including video", text: "I write the shot list for Google's live video verification: continuous, unedited, showing your signage or location and proof you run the business. You or your staff record it." }
      - { title: "Duplicate listings", text: "Second and third listings for the same business claimed, merged or removed, so reviews and signals stop being split." }
      - { title: "Unwanted suggested edits", text: "Changes Google or the public made to your hours, category or pin found, corrected and monitored." }
      - { title: "Service-area setup", text: "Address hidden if customers don't visit you, and service areas set to where you really work, up to Google's limit of 20." }
      - { title: "Wrong pin or category", text: "The two quickest wins. A pin on the wrong side of the road or a vague category can hide an otherwise good profile." }
