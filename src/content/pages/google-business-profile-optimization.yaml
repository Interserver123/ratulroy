intro:
  - "**What is Google Business Profile optimization?** It is completing and correcting every part of your Google Business Profile (formerly Google My Business): the right categories, services, description, hours, photos and posts, a steady flow of answered reviews, and details that match your website, so Google can confidently show you for nearby searches and searchers choose you."
sections:
  - type: audit
    nav: Free checklist
    id: checklist
    eyebrow: "GBP optimization checklist"
    heading: "Score your own profile in two minutes"
    intro: "This is the field-by-field checklist I work through on every profile. Tick what yours already has and see where the gaps are. The [full GBP optimization checklist](/blog/google-business-profile-optimization-checklist) explains each field in more depth."
    blocks:
      - heading: Identity & location
        bullets:
          - "**Business name** exactly as on your signage, with no added keywords or city"
          - "**Address and pin** on your actual entrance, or address hidden if you are a service-area business"
          - "**Service areas** set to where you really work"
          - "**Phone and website** matching your site and other listings"
      - heading: Relevance
        bullets:
          - "**Primary category** that matches your main service"
          - "**Secondary categories** for the other services you genuinely offer"
          - "**Services list** complete, with short descriptions"
          - "**Products** added where you sell specific items or packages"
          - "**Business description** that says what you do and where, written for people"
      - heading: Trust & engagement
        bullets:
          - "**Regular hours and special hours** (Eid, public holidays, Friday) kept accurate"
          - "**Attributes** filled in (accessibility, payments, amenities)"
          - "**Real photos**: exterior, interior, team and work, added regularly"
          - "**Logo and cover photo** set and on-brand"
          - "**Google Posts** published at least monthly"
      - heading: Reviews & tracking
        bullets:
          - "**A review request link** your team actually sends"
          - "**Every review replied to**, good and bad"
          - "**Booking or appointment link** where it applies"
          - "**Rankings tracked on a geo-grid**, not from one spot"
          - "**Calls, directions and clicks** checked each month"
    buttons:
      - { label: Get my free GBP audit, href: "/#free-audit" }
    note: "Public Q&A was retired by Google in late 2025. Questions are now answered from your profile, reviews and website, which is why the fields above matter more."
  - type: factors
    nav: How ranking works
    id: how-ranking-works
    alt: true
    eyebrow: How Google Maps ranking works
    heading: "What Google looks at before showing your profile"
    intro: "Google says local results are mainly based on [relevance, distance and prominence](https://support.google.com/business/answer/7091), and that you cannot pay for a better local ranking. Optimization works on relevance and prominence; distance is fixed by where you are."
    stat: { value: "", label: "Your profile" }
    items:
      - title: Relevance
        label: Relevance
        text: "How well the profile matches the search. Driven by categories, services, products, the description and the website it links to."
      - title: Distance
        label: Distance
        text: "How close you are to the searcher or the area they typed. Nobody can change this, which is why a precise pin and an honest service area matter."
      - title: Prominence
        label: Prominence
        text: "How well known and trusted you are. Reviews and ratings, links, articles and directory listings all feed it."
