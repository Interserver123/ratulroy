    intro: "Four stages, in this order, with roughly when each one tends to show. Nobody can guarantee a position, and Google says you cannot pay for a better local ranking, so what is promised is the work."
    note: "dentist near me"
    items:
      - label: "Week 1–2"
        title: "Audit & baseline"
        text: "Profile, website, citations, reviews and competitors checked, plus a geo-grid scan of where you rank across your area today."
        bullets: ["Geo-grid baseline", "Competitor gap list", "Prioritised fix plan"]
        value: "9"
        meta: "Ranking #9: outside the pack, invisible beyond your street"
      - label: "Month 1"
        title: "Fix the foundation"
        text: "Categories, services, pin, hours and photos corrected. Duplicates merged. Website pages and technical issues that undercut the profile fixed."
        bullets: ["GBP optimization", "NAP and duplicate clean-up", "On-page and technical fixes"]
        value: "6"
        meta: "Errors gone. Quick wins when a category or pin was the problem"
      - label: "Months 2–3"
        title: "Build relevance"
        text: "Citations on the platforms that matter, service and area pages, a review routine your team actually follows, first local links."
        bullets: ["Citations & NAP", "Service + area pages", "Review routine"]
        value: "4"
        meta: "Visibility spreading out from your address on the grid"
      - label: "Months 4–6"
        title: "Grow prominence & hold"
        text: "Review velocity, links and mentions, and content aimed at the weak zones of the grid. Then defend the positions and expand."
        bullets: ["Reviews & replies", "Local links & mentions", "Monthly geo-grid report"]
        value: "2"
        meta: "In the Map Pack: calls and direction requests start to climb"
    body:
      - "Crowded categories in big cities take longer than a quiet category in a smaller town. The month-by-month detail is in [how long Local SEO takes](/blog/how-long-local-seo-takes-bangladesh)."
