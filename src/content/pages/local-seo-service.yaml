    eyebrow: Diagnosis
    heading: "Why your business isn't showing on Google Maps"
    intro: "When a business is missing from the map pack, it is almost always one of these. The free audit checks every one."
    items:
      - { title: "Profile unverified, suspended or incomplete", text: "An unverified profile does not show at all, and a thin one rarely beats a complete competitor." }
      - { title: Wrong primary category, text: "The single most common cause. A dentist listed as *Medical clinic* competes for the wrong searches." }
      - { title: "NAP mismatches and duplicates", text: "Two listings for one business split reviews and confuse Google about which one is real." }
      - { title: Pin in the wrong place, text: "A pin dropped on the wrong side of a busy road changes who sees you. Common in Bangladesh, where addresses are written by landmark." }
      - { title: Too few or stale reviews, text: "Competitors with a steady stream of recent reviews look more trustworthy to Google and to customers." }
      - { title: "A website that doesn't back it up", text: "No page for the service, slow on mobile, or details that differ from the profile." }
