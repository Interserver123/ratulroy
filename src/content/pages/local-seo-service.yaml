    nav: "What's included"
    id: whats-included
    alt: true
    columns: 3
    eyebrow: "What's included"
    heading: "Everything a local business needs to rank on Maps, in one service"
    intro: "Each part supports the others. Google cross-checks your profile against your website and the rest of the web, so working on one in isolation is slower."
