intro:
  - "**What are local SEO services?** Local SEO services are the work that makes a business appear, and look like the obvious choice, when someone nearby searches Google or Google Maps for what it sells. That means optimizing the Google Business Profile, keeping name, address and phone consistent across the web, earning reviews, and building website pages that confirm what you do and where."
sections:
  - type: factors
    nav: How ranking works
    id: how-ranking-works
    eyebrow: How Google ranks local businesses
    heading: "Three things decide who gets the Map Pack"
    intro: "Google says local results are based mainly on [relevance, distance and prominence](https://support.google.com/business/answer/7091). Distance you cannot change. Everything in this service is aimed at the other two, which is where most profiles are weak."
    stat: { value: "", label: "Map Pack" }
    items:
      - title: Relevance
        label: Relevance
        text: "How well your profile and website match the search. Categories, services, the business description and your service pages all feed it."
        bullets: ["Correct primary and secondary categories", "Every service listed, with the words customers use", "Service and location pages that match the profile"]
      - title: Distance
        label: Distance
        text: "How far your business is from the searcher, or from the area they named. It is fixed by your address, so the work is making sure Google places you precisely."
        bullets: ["Pin on your actual entrance", "Service area set for where you really work", "No fake addresses: they get listings suspended"]
      - title: Prominence
        label: Prominence
        text: "How well known and trusted the business is, online and off. Reviews, citations, links and mentions are what move it."
        bullets: ["Steady flow of genuine reviews, all answered", "Consistent citations on the platforms that matter", "Local links, partners and press"]
