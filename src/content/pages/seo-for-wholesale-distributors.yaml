intro:
  - "**SEO for wholesale distributors** is search optimization for businesses that sell in bulk to retailers, contractors and other companies. It covers catalog and category pages built around trade searches, Product schema, RFQ and quote pages, a distributor locator, and Google Business Profiles for showrooms and trade counters, so buyers find you while shortlisting suppliers."
