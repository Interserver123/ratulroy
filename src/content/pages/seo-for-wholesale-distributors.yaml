sections:
  - type: list
    eyebrow: Built for B2B buyers
    heading: "How do B2B buyers search for a wholesale supplier?"
    body:
      - "Procurement managers, shop owners and contractors search for a supplier before they ever call one. Their searches look like \"PVC pipe wholesale supplier Chattogram\", \"bulk A4 paper distributor\", \"tiles wholesale near me\" or a manufacturer's part number. If your category pages don't match those searches, the buyer's shortlist is built without you."
      - "Wholesale search is mostly a catalog problem first and a local problem second. Category pages and product pages bring the research traffic; a [Google Business Profile](/google-business-profile-optimization) for each showroom or trade counter catches the buyers who want to see stock or collect the same day."
    bullets:
      - "Rank for \"wholesale\", \"bulk\", \"supplier\" and \"distributor\" searches in your product categories"
      - "Category and product pages written for trade buyers, not retail shoppers"
      - "Technical SEO for large catalogs, filters and PDF spec sheets"
      - "Local SEO for warehouses, showrooms and trade counters that serve customers in person"
  - type: cards
    alt: true
    columns: 3
    eyebrow: "What's inside"
    heading: "Wholesale SEO, built layer by layer"
    intro: "Catalog structure, category and product pages, schema, RFQ flow, local locations, links and AI search, in the order that usually moves enquiries fastest."
    items:
      - { title: "B2B keyword and intent research", text: "I map wholesale, bulk, supplier, distributor, importer and part-number searches in your category, then assign each to one catalog, category or product page so pages don't compete with each other.", bullets: ["Wholesale plus city keyword sets", "RFQ and buyer-intent mapping", "Category gap analysis"] }
      - { title: "Category and product page optimization", text: "Category pages are where most wholesale rankings come from. I rewrite them with what trade buyers check: minimum order quantity (MOQ), pack sizes, price tiers if you publish them, lead times, brands carried and certifications.", bullets: ["MOQ and pack-size copy", "Spec sheets and datasheets", "Trust signals for procurement"] }
      - { title: "Technical SEO for large catalogs", text: "Faceted navigation rules, canonical tags, XML sitemaps split by category, indexable PDF spec sheets and crawl paths that reach every SKU worth ranking.", bullets: ["Facet and canonical rules", "Sitemap segmentation", "Indexable PDF specs"], href: /technical-seo }
      - { title: "Product schema and structured data", text: "Product, Offer, Brand and Organization markup, plus LocalBusiness or Store for each location. Google's product rich results expect a price, review or rating, so quote-only items won't show price snippets, but the markup still describes what you stock.", bullets: ["Product and Offer schema", "Brand and Organization", "LocalBusiness per location"] }
      - { title: "RFQ and quote request pages", text: "A short request-for-quote form on every category and product page, with fields for quantity, delivery location and timeline, so research visits turn into enquiries your sales team can price.", bullets: ["RFQ form on key pages", "Quantity and delivery fields", "Enquiry tracking in GA4"] }
      - { title: "Distributor and dealer locator", text: "If you supply through dealers or have several branches, a locator page with a crawlable page per location (address, hours, map, stock focus) helps buyers find the nearest point and gives Google a clear location structure.", bullets: ["Crawlable location pages", "Embedded map and hours", "Consistent NAP per branch"] }
      - { title: "Google Business Profile for showrooms and warehouses", text: "One profile per location that serves customers in person during stated hours, such as a showroom, trade counter or collection point. A warehouse with no customer contact is not eligible, so I won't create a listing for one.", bullets: ["GBP per eligible location", "Correct wholesale categories", "Reviews from trade customers"], href: /local-seo-service }
      - { title: "Links and supplier authority", text: "Mentions and links from manufacturer \"where to buy\" pages, trade associations, industry directories and B2B marketplaces, the sources that move category rankings and corroborate who you are. More on the directory side in this [citations and NAP consistency guide](/blog/local-citations-nap-consistency-guide).", bullets: ["Manufacturer dealer listings", "Trade association pages", "Industry directories"] }
      - { title: "AI search for B2B", text: "Buyers increasingly ask Google AI Overviews, ChatGPT search, Gemini and Perplexity to suggest suppliers. Clear category pages, consistent entity data and third-party mentions decide whether you are named.", bullets: ["Generative Engine Optimization", "Entity consistency", "Citable product facts"], href: /generative-engine-optimization }
  - type: prose
    heading: "Does a wholesale distributor need Google Merchant Center?"
    body:
      - "Only in some cases. Merchant Center feeds Google Shopping and free product listings, which are built for products a shopper can buy at a listed price. If you sell online with visible prices and checkout, including to trade customers, a product feed can add visibility. If your catalog is quote-only, Merchant Center is usually not the right channel, and the effort is better spent on category pages and RFQ flow."
      - "The same goes for showrooms that sell to walk-in customers: Google's local inventory options exist, but they need accurate stock and price data. I'll tell you honestly whether a feed is worth setting up for your catalog."
  - type: cards
    columns: 3
    eyebrow: Why work with me
    heading: "Why distributors work with Ratul Roy"
    intro: "Most of my work is Local SEO for businesses that depend on calls and enquiries. Wholesale adds catalog scale, and the same principles apply: clear pages, consistent business data and measurement that counts enquiries, not traffic. The closest proof is the catalog SEO behind [Hamper Story's growth to $72,412 in monthly sales](/case-studies/hamper-story)."
    items:
      - { title: Direct specialist, text: "You work with me, not an account manager passing notes to a junior. One person who knows your catalog." }
      - { title: Catalog-aware technical work, text: "Faceted navigation, canonical tags, PDF spec sheets and sitemap structure handled before content, because on a large catalog they decide what Google can even see." }
      - { title: Multi-location Local SEO, text: "Google Business Profiles and location pages for every showroom and trade counter that serves customers in person." }
      - { title: AI search ready, text: "Entity and schema work that helps AI Overviews, ChatGPT search, Gemini and Perplexity describe your business correctly." }
      - { title: Enquiry-focused reporting, text: "Reporting on RFQs, enquiries and calls by category, not ranking screenshots for keywords nobody searches." }
      - { title: Transparent process, text: "Monthly reports on rankings, indexed pages, traffic and enquiries, so you know what the work produced." }
  - type: quotes
    alt: true
    eyebrow: Client Voices
    heading: "What wholesale clients say"
    quotes:
      - { quote: "Our category pages were invisible. Six months in, we're ranking for the supplier and bulk queries that actually bring RFQs. Our pipeline finally compounds.", name: "Tanvir A.", meta: "Industrial Supplies Distributor · Dhaka" }
      - { quote: "Ratul understands B2B catalogs in a way most SEOs don't. The technical and schema work alone unlocked thousands of indexed SKUs.", name: "Nadia I.", meta: "FMCG Wholesale · Chattogram" }
      - { quote: "Each depot now ranks in its own local pack. The depot-level GBP strategy was a game changer for our regional sales teams.", name: "Rafiq M.", meta: "Building Materials Distributor · Sylhet" }
    body:
      - "Many distributors sell to trades and contractors. If that is your market, see how your buyers search on the [home services SEO page](/seo-for-home-services). Distributors in Old Dhaka's wholesale markets can also read the notes on [Local SEO in Dhaka](/local-seo-dhaka)."
faqHeading: "Everything You Need to Know About Wholesale Distributor SEO"
faqs:
  - { q: "Why is SEO important for wholesale distributors?", a: "Because B2B buyers shortlist suppliers through Google before contacting sales. If your category pages don't rank for wholesale, bulk and supplier searches in your products, you miss the buyer at the moment they are building a shortlist, and the RFQ goes to whoever they found." }
  - { q: "How is wholesale SEO different from e-commerce SEO?", a: "Wholesale SEO targets trade intent (bulk, MOQ, supplier, distributor, RFQ) instead of single-unit retail. Pages need pack sizes, lead times, certifications and a quote path rather than a basket. Catalogs are usually larger too, so faceted navigation and PDF spec sheets need careful technical handling." }
  - { q: "How long does wholesale distributor SEO take?", a: "Most distributors see meaningful ranking and enquiry gains in 3 to 6 months. Catalog SEO builds over time: as more category and product pages rank, B2B enquiries grow month over month rather than spiking and dropping." }
  - { q: "Do you handle technical SEO for large product catalogs?", a: "Yes. Crawl paths, canonical tags, faceted navigation rules, XML sitemap splitting, indexable spec sheets and Core Web Vitals are part of every wholesale project, because on a large catalog [technical SEO](/technical-seo) decides which pages can rank at all." }
  - { q: "Can a warehouse have a Google Business Profile?", a: "Only if it serves customers in person during its stated hours, for example as a trade counter, showroom or collection point. A warehouse that only ships orders is not eligible. Each eligible location gets its own profile, location page and citations." }
  - { q: "Should product pages show prices if we quote every order?", a: "Not necessarily. You can rank without public prices. Show what you can (MOQ, pack sizes, price from, or tier bands) and make the quote request easy. Without a price, Google won't show price rich results, but the pages can still rank for product and supplier searches." }
  - { q: "Do you work with distributors outside Bangladesh?", a: "Yes. I work with distributors in Bangladesh and internationally. The principles around catalog SEO, trade search intent and supplier authority hold in any market; the directories, languages and local search habits change from country to country." }
