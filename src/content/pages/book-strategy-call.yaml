  eyebrow: What to Expect
  heading: Before, during, and after your free Local SEO strategy call
  intro: A clear walkthrough of who the call is for, the audit work that happens before it, what we cover in the 30 minutes, and what you walk away with, whether or not we end up working together.
  items:
  - title: Who the strategy call is for
    text: This call is designed for owners and marketing leads of service businesses who already have a real Google Business Profile and website but aren't getting the inbound calls they should. If you're pre-launch, pre-website, or selling globally with no local component, a different conversation will serve you better and I'll happily say so on the call.
  - title: What happens before the call
    text: Once you book a slot, I run a short pre-call audit on your Google Business Profile, your website, your top 3 competitors, and your geo-grid visibility across your service area. That way the 30 minutes we spend together is already grounded in your actual data, not a generic pitch.
  - title: What happens during the call
    text: A walkthrough of where your Local SEO actually stands right now (relevance, distance, prominence); the 2-3 highest-leverage fixes I'd ship in the first 30 days if you hired me; an honest read on realistic timelines, expected lift, and what 'good' looks like for your category; and a clear, transparent quote if we both want to move forward, and a polite goodbye if we don't.
  - title: What happens after
    text: Whether or not we end up working together, you'll leave the call with a written summary of the audit findings and the recommended next steps. You can hand that document to an in-house team, another agency, or just keep it for reference. No pressure, no hard pitch, that part isn't negotiable.
faqHeading: Everything You Need to Know About Your Strategy Call
faqs:
- q: What happens on the strategy call?
  a: Your Google Business Profile, map pack visibility, website, and competitors are reviewed live. You leave knowing what is holding rankings back and what the first fixes would be, whether or not you go on to work together.
- q: How long is the call?
  a: Around thirty minutes. Enough to review your visibility properly and answer questions, without turning into a sales presentation.
- q: Is this a sales call?
  a: It is a diagnostic call. If the work is a fit, that will come up naturally at the end. If it is not, you will be told so and still leave with the audit findings.
- q: What should I have ready?
  a: Your website address and your Google Business Profile. Access to Search Console or analytics helps but is not required for a first conversation.
- q: Will you tell me the price on the call?
  a: Yes. Packages start from $299. Where you land above that depends on your competition, how many areas you need to rank in, and the current state of your profile and website, which is exactly what the call establishes.
