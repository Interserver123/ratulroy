faqHeading: Everything You Need to Know About Your Strategy Call
faqs:
- q: Is the intro call really free?
  a: Yes. The 30-minute intro call costs nothing and comes with no obligation. I look at your Google Business Profile and Map Pack competitors with you and tell you honestly whether Local SEO is the right next step.
- q: What do I get in the $79 Strategy Session?
  a: Before the call I audit your Google Business Profile, your Google Maps rankings and your website. On the 60-minute call we go through what is holding you back and what to fix first. You get the recording and a written 30-day action plan within 48 hours.
- q: How does payment work?
  a: You pick a time and send the request; nothing is charged on this page. I confirm the slot on WhatsApp or email and, for paid calls, send a secure payment link. The time is held for you once it is paid. The intro call is free.
- q: What time zone are the times in?
  a: The calendar shows every slot in your own time zone, with the Bangladesh time (GMT+6) underneath. I take calls Saturday to Thursday, 10 AM to 8 PM Bangladesh time.
- q: Which platform do we use for the call?
  a: Google Meet by default. WhatsApp video or Zoom work too; choose what suits you when you book and I will send the link with the confirmation.
- q: Can I reschedule or cancel?
  a: Yes. Message me on WhatsApp or reply to the confirmation at least 12 hours before the call and we will find a new time.
- q: Is this a sales call?
  a: No. Every call is diagnostic first. If done-for-you work is a fit, that will come up naturally at the end. If it is not, I will tell you so, and you still leave with the findings.
- q: Can you guarantee a Top 3 Map Pack position?
  a: No, and nobody honestly can. Google states there is no way to pay for or request a better local ranking. On the call I will give you a realistic view of what is achievable in your area and how long it usually takes.
