faqHeading: Everything You Need to Know About Your Strategy Call
faqs:
- q: What happens on the strategy call?
  a: I review your Google Business Profile, Map Pack visibility, website and competitors with you live. You leave knowing what is holding your rankings back and what the first fixes would be, whether or not you go on to work with me.
- q: How long is the call?
  a: About 30 minutes. That is enough to review your visibility properly and answer your questions, without turning into a sales presentation. If we need longer, we can arrange a follow-up.
- q: Is this a sales call?
  a: It is a diagnostic call. If the work is a fit, that will come up naturally at the end. If it is not, I will tell you so, and you still leave with the audit findings.
- q: What should I have ready?
  a: Your website address and your Google Business Profile link. Access to Google Search Console or GA4 helps but is not required for a first conversation. A list of the areas you serve and your main services is useful too.
- q: Will you tell me the price on the call?
  a: Yes. Packages start from $299. Where you land above that depends on your competition, how many areas you need to rank in, and the current state of your profile and website, which is exactly what the call establishes.
- q: Can you guarantee a Top 3 Map Pack position?
  a: No, and nobody honestly can. Google states there is no way to pay for or request a better local ranking. On the call I will give you a realistic view of what is achievable in your area and how long it usually takes.
