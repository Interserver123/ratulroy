  intro: Who the call is for, the audit work that happens before it, what we cover and what you walk away with, whether or not we end up working together.
  items:
  - title: Who the strategy call is for
    text: Owners and marketing leads of service businesses who already have a Google Business Profile and a website but aren't getting the calls they should. If you're pre-launch, have no website yet, or sell online with no local customers, a different conversation will serve you better, and I'll say so on the call.
  - title: What happens before the call
    text: Once you book a slot, I run a short pre-call audit of your Google Business Profile, your website, your top 3 competitors and your geo-grid visibility across your service area. The 30 minutes we spend together are then based on your actual data, not a generic pitch.
  - title: What happens during the call
    text: "A walkthrough of where your Local SEO stands against Google's three local ranking factors (relevance, distance and prominence); the 2 or 3 fixes I would make in the first 30 days; an honest read on realistic timelines and what good looks like for your category; and a clear quote if we both want to move forward."
  - title: What happens after
    text: Whether or not we work together, you leave with a written summary of the audit findings and recommended next steps. You can hand it to an in-house team, another agency, or keep it for reference. No pressure and no lock-in contract if you do hire me.
