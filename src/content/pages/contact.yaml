faqHeading: Everything You Need to Know About Getting In Touch
faqs:
- q: How quickly will I get a reply?
  a: WhatsApp replies usually arrive within 2 hours on working days (Bangladesh time, GMT+6), and email within 24 hours. Every message is answered personally, so if your question is urgent, WhatsApp on +8801866820758 is the fastest route.
- q: What should I include in my message?
  a: Your website, your Google Business Profile link if you have one, the areas you serve, and what you are trying to fix. That is enough for a useful first answer rather than a generic reply, and often enough for me to spot the main problem.
- q: Is the first consultation free?
  a: Yes. The first conversation covers your current visibility, the gaps that are costing you calls, and whether working together makes sense. There is no charge for it and no obligation afterwards.
- q: Where are you based, and do you work with businesses outside Bangladesh?
  a: I'm based in Bangladesh. I work remotely with businesses across Bangladesh and with clients worldwide. We talk over WhatsApp, email or a scheduled call.
- q: What if I am not ready to hire anyone yet?
  a: That is fine, and common. Plenty of people get in touch to understand what is wrong before deciding on a budget or a timeline. You will get a straight answer either way, and the [blog](/blog) covers most first questions in detail.
- q: Do you take on every business that enquires?
  a: No. If your situation needs something other than Local SEO, or the timeline you need is not realistic, I will tell you rather than sell to you.
