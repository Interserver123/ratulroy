  heading: How to get the most out of your first message
  intro: A short, honest guide on what to include in your first message, how fast you'll hear back, and what the first conversation actually covers.
  blocks:
  - heading: Before you message, what to include
    body:
    - I read every message personally. To give you a useful first reply (and not a generic 'thanks, I'll be in touch'), it helps if your first message includes a few specifics. The more context you can share up front, the faster I can give you a concrete answer or a useful audit pointer.
    bullets:
    - Your business name, website, and the city or service area you operate in.
    - 'The single biggest problem you want solved: Map Pack ranking, GBP optimisation, website SEO, AI search visibility, or a full strategy.'
    - Roughly what you've tried before, if anything (in-house SEO, an agency, freelancers).
    - A rough budget range, even if it's just 'starter' or 'serious'. It saves both of us a round trip.
  - heading: How fast you'll hear back
    body:
    - WhatsApp is the fastest channel, usually under 2 hours during working days (Bangladesh time, GMT+6). Email replies typically go out within 24 hours. If your project is urgent and time-sensitive, write 'urgent' in the subject line or message and I'll prioritise it.
    - If you'd rather skip the back-and-forth and just jump on a call, you can [book a free 30-minute strategy session](/book-strategy-call) directly.
  - heading: What the first conversation covers
    bullets:
    - Where your Google Business Profile and website currently stand.
    - The 2-3 highest-leverage fixes you could ship in the next 30 days.
    - Whether Local SEO is actually the right channel for your business right now.
    - A clear, honest answer on whether and how we should work together.
faqHeading: Everything You Need to Know About Getting In Touch
faqs:
- q: How quickly will I get a reply?
  a: Messages are answered personally, usually within one working day. WhatsApp tends to be the fastest route if your question is urgent.
- q: What should I include in my message?
  a: Your website, your Google Business Profile link if you have one, the areas you serve, and what you are trying to fix. That is enough to give you a useful first answer rather than a generic reply.
- q: Is the first consultation free?
  a: Yes. The first conversation covers your current visibility, the gaps that are costing you calls, and whether this is a sensible fit. There is no charge for it.
- q: What if I am not ready to hire anyone yet?
  a: That is fine, and common. Plenty of people get in touch to understand what is wrong before deciding on a budget or a timeline. You will get a straight answer either way.
- q: Do you take on every business that enquires?
  a: No. If your situation needs something other than Local SEO, or the timeline you need is not realistic, you will be told rather than sold to.
