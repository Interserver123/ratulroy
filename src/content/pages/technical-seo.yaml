    eyebrow: Does this sound familiar
    heading: "Most people search for this because something already broke"
    intro: "You rarely go looking for technical SEO in the abstract. You go looking because a page vanished, traffic dropped, or the site feels slow. Here is what usually sits behind each of those."
    items:
      - { title: "Pages are live but missing from Google", text: "**Usual cause:** blocked in robots.txt, marked noindex, orphaned with no internal links, or the canonical points somewhere else." }
      - { title: "The site is slow, especially on phones", text: "**Usual cause:** unoptimised images, render-blocking scripts, layout that shifts while loading. Core Web Vitals fail and mobile users leave first." }
      - { title: "Traffic fell without a content change", text: "**Usual cause:** a migration broke redirects, a plugin changed output sitewide, or duplicate URLs started competing with each other." }
      - { title: "Rich results never appear", text: "**Usual cause:** structured data missing, invalid, or describing something the page does not visibly contain." }
