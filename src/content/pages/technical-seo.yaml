intro:
  - "**What is technical SEO?** Technical SEO is the work that lets Google crawl, render, index and understand a website: robots.txt, XML sitemaps, canonical tags, redirects, internal links, Core Web Vitals (LCP, INP, CLS), mobile rendering and structured data. It does not write content or earn reviews. It removes the faults that stop both from counting."
sections:
  - type: problems
    eyebrow: Does this sound familiar
    heading: "Why are my pages not ranking, or not in Google at all?"
    intro: "You rarely go looking for technical SEO in the abstract. You go looking because a page vanished, traffic dropped, or the site feels slow. Here is what usually sits behind each of those."
    items:
      - { title: "Pages are live but missing from Google", text: "**Usual cause:** blocked in robots.txt, a stray noindex tag, orphaned with no internal links, or a canonical tag pointing to a different URL. Search Console shows it as \"Crawled, currently not indexed\" or \"Excluded by noindex\"." }
      - { title: "The site is slow, especially on phones", text: "**Usual cause:** oversized images, render-blocking scripts, heavy page builders and layout that shifts while loading. Core Web Vitals fail, and visitors on mobile data leave first." }
      - { title: "Traffic fell without a content change", text: "**Usual cause:** a migration broke redirects, a plugin changed output sitewide, or duplicate URLs (www and non-www, http and https, tracking parameters) started competing with each other." }
      - { title: "Rich results never appear", text: "**Usual cause:** structured data missing, invalid, or describing something the page does not visibly contain." }
      - { title: "Location pages exist but never rank", text: "**Usual cause:** near-identical city pages with the name swapped, no internal links pointing to them, or left out of the XML sitemap." }
      - { title: "Content only appears after JavaScript runs", text: "**Usual cause:** service text, links or prices injected client-side, so the HTML Google first receives is close to empty." }
  - type: cards
    alt: true
    columns: 3
    eyebrow: What is covered
    heading: "Six areas of technical SEO, worked in order of impact"
    intro: "Crawling and indexing come first, because nothing else matters until your pages are eligible to rank at all."
    items:
      - { title: "Crawling & indexing", text: "Making sure Googlebot can reach every page you want ranked, and spends no time on the ones you don't.", bullets: ["robots.txt and meta robots audit", "XML sitemap accuracy and coverage", "Crawl budget waste on large or faceted sites", "Search Console Page indexing report resolved"] }
      - { title: "Core Web Vitals & speed", text: "Fixing what actually moves LCP, INP and CLS for real users, rather than chasing a lab score.", bullets: ["Largest Contentful Paint diagnosis", "Interaction to Next Paint and long tasks", "Layout shift and render-blocking fixes", "Image format, sizing and lazy loading"] }
      - { title: "Site architecture & redirects", text: "So authority flows to the pages that should rank, and nothing is stranded.", bullets: ["Internal linking structure and click depth", "301 redirects, chains and broken links", "Canonical tags and duplicate URL handling", "Pagination and faceted URL control"] }
      - { title: Structured data, text: "Your business facts stated in schema.org markup, in JSON-LD, so machines read them without guessing.", bullets: ["LocalBusiness subtype, Service, Organization", "FAQPage, BreadcrumbList and Article", "Validation and rich-result eligibility", "Parity between schema and visible content"] }
      - { title: "Mobile & JavaScript rendering", text: "Checking what Google actually renders with mobile-first indexing, not what your desktop browser shows.", bullets: ["Rendered HTML checked with URL Inspection", "Content parity between mobile and desktop", "JavaScript rendering and hydration checks", "Viewport, tap targets and readability"] }
      - { title: "International, security & hygiene", text: "The basics that quietly cost trust when they are wrong.", bullets: ["hreflang for English and Bangla versions", "HTTPS, mixed content, one canonical hostname", "Correct 404, 410 and 301 status codes", "Soft 404 and thin page detection"] }
  - type: cards
    columns: 3
    eyebrow: Technical SEO for local businesses
    heading: "How technical SEO supports Google Maps rankings"
    intro: "Google reads the website linked from your Business Profile when it judges relevance and trust. For a local business, these are the technical checks that matter most, and they are part of every [Local SEO campaign](/local-seo-service) I run."
    items:
      - { title: "LocalBusiness schema that matches the profile", text: "The right subtype (Dentist, Plumber, HVACBusiness, AutoRepair, LegalService and so on) with name, address, geo, areaServed, openingHoursSpecification, hasMap and sameAs, all identical to your Google Business Profile." }
      - { title: "Location and service-area pages that get indexed", text: "Each real area page linked from the navigation or a hub, listed in the XML sitemap, self-canonical and different enough from its siblings to be worth indexing." }
      - { title: "The GBP website link lands on the right page", text: "The URL in your profile resolves in one hop, returns 200, carries a UTM tag for GA4 and is the canonical version. A multi-location brand points each profile to its own location page." }
      - { title: "NAP as crawlable text", text: "Business name, address and phone in the footer and contact page as real HTML text, not an image, matching your citations character for character." }
      - { title: "Fast on mobile data", text: "Most local searches in Bangladesh happen on phones over mobile data. Pages are tested at that speed, with LCP and INP fixed for the slowest likely visitor." }
      - { title: "Embedded map and clean contact page", text: "A Google Maps embed of your verified listing, click-to-call phone links and directions that work, so a visitor from the Map Pack can act in one tap." }
    body:
      - "If the profile itself needs work, that is a separate job: see [Google Business Profile optimization](/google-business-profile-optimization). For the full list of reasons a business stays off the map, read [why your business is not showing on Google Maps](/blog/why-my-business-not-showing-google-maps)."
  - type: steps
    eyebrow: How it runs
    heading: "Diagnose, fix, then prove it cleared"
    intro: "Technical work is verifiable in a way most SEO is not. Errors either clear in Search Console or they do not."
    items:
      - { title: "Crawl & audit", text: "Full crawl of the site plus Google Search Console analysis (Page indexing, Core Web Vitals, enhancements), producing faults ordered by impact rather than by severity label." }
      - { title: Prioritise, text: "Separate what blocks indexing from what merely tidies. Blockers first, because nothing else counts until pages are eligible." }
      - { title: "Fix or specify", text: "Implement the changes directly, or write a developer-ready specification with exact instructions if you have an in-house team." }
      - { title: Validate, text: "Re-crawl, re-test rendering with URL Inspection, validate structured data with the Rich Results Test, and confirm in Search Console that the errors actually cleared." }
      - { title: Monitor, text: "Periodic checks, because redirects break and sites accumulate faults as they grow. Regressions get caught before they cost traffic." }
  - type: prose
    eyebrow: Common questions, answered properly
    heading: "Crawl budget, Core Web Vitals and JavaScript: what matters for your site"
    blocks:
      - heading: Does crawl budget matter for a small site?
        body:
          - "Usually not. Crawl budget is how many URLs Googlebot will crawl on your site in a given period, and a 30-page local business site rarely hits it. It matters on large sites: e-commerce stores and catalogues with filters, where faceted navigation can create thousands of near-duplicate URLs. That is a common problem for [wholesale distributors with large product catalogues](/seo-for-wholesale-distributors)."
      - heading: What are good Core Web Vitals scores?
        body:
          - "Google's thresholds for a \"good\" experience are an LCP of 2.5 seconds or less, an INP of 200 milliseconds or less, and a CLS of 0.1 or less, measured on real users at the 75th percentile. Page experience is one signal among many. A fast page with weak content will not outrank a relevant one, but a slow page loses visitors before they call."
      - heading: Can Google index a JavaScript website?
        body:
          - "Yes, Google renders JavaScript, but rendering can be delayed and things go wrong: links built without real anchor tags, content loaded only after a click, or errors that leave the page blank. Server-side rendering or static HTML for the important content removes the risk."
      - heading: What does good technical SEO look like over time?
        body:
          - "The [TechicTalk case study](/case-studies/techictalk-organic-growth) shows a new site built on clean technical foundations growing to 976K organic clicks and 30M+ impressions. A smaller example is the [data-driven growth case study](/case-studies/data-driven-organic-growth): 3.93K clicks and an 8.3% CTR in six months."
  - type: cards
    alt: true
    columns: 3
    eyebrow: Where it fits
    heading: "Technical SEO is a floor, not a growth lever"
    intro: "Worth being straight about this. Technical work removes ceilings. It does not create demand. If your foundations are already sound, the gains come from elsewhere, and you should be told that rather than sold an audit."
    items:
      - { title: Pairs with Local SEO, text: "Crawl errors and slow mobile performance weaken the Business Profile the website supports. Technical fixes are usually month one of a local campaign." }
      - { title: Pairs with GBP work, text: "Profile optimization moves faster when the linked website is sound, because on-site signals reinforce the listing." }
      - { title: Underpins AI visibility, href: /generative-engine-optimization, cta: "AI search visibility (GEO)", text: "Google AI Overviews, ChatGPT and Perplexity work from crawlable, structured facts. Blocked pages and broken markup take you out of that pool." }
    body:
      - "New to the topic? Start with [what an SEO specialist actually does](/blog/what-does-seo-specialist-do), or see [what SEO costs in Bangladesh](/blog/seo-cost-bangladesh)."
