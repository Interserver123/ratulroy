faqHeading: "Everything You Need to Know About Technical SEO"
faqs:
  - q: "What is technical SEO, in plain terms?"
    a: "Technical SEO is the work that lets search engines reach, read and trust your website: crawling, indexing, site speed, mobile rendering, structured data, redirects and site architecture. It does not write your content or build your reputation; it removes the obstacles stopping both from counting."
  - q: "How do I know if I need technical SEO?"
    a: "Common signals: pages missing from Google despite being live, traffic that fell without a content change, a slow or unstable site on mobile, duplicate versions of the same page ranking against each other, or Search Console reporting coverage errors you do not understand."
  - q: "Is technical SEO a one-off project or ongoing?"
    a: "Mostly a project, then maintenance. The audit and the fixes are finite work. After that it needs periodic checks, because redirects break, plugins change output, and sites accumulate faults as they grow."
  - q: "Will technical SEO alone increase my rankings?"
    a: "Rarely on its own. Technical work removes ceilings rather than creating demand. If crawling and indexing are broken it can produce a sharp gain, because pages that were invisible become eligible. If the foundations are already sound, the gain comes from content and local signals instead."
  - q: "Do you fix the issues or just report them?"
    a: "Both are available. Some clients want the fixes implemented directly, others have a developer and want a prioritised specification they can hand over. Say which you need and the engagement is scoped that way."
  - q: "Will you need access to my website and hosting?"
    a: "For implementation, yes: CMS access at minimum, and often hosting or DNS depending on what needs changing. For an audit alone, Search Console and a crawl of the public site are usually enough."
  - q: "How does this relate to Local SEO?"
    a: "Google reads the website linked from your Business Profile to judge relevance and trust. A site with crawl errors, slow mobile performance or missing structured data weakens the profile it supports, which is why technical work sits underneath the local work rather than beside it."
  - q: "How much does technical SEO cost?"
    a: "It is bought three ways. A technical audit starts from $299 and gives you the fault list and a developer-ready specification. Implementation as a one-off project, and an ongoing retainer for monitoring, are both quoted after the audit, because site size and the number of faults found decide the work."
