  - type: prose
    eyebrow: Services in Detail
    heading: "Local SEO, website SEO, and AI search visibility: what each engagement covers"
    intro: "A full breakdown of every workstream, signal, and deliverable included across Local SEO, Google Maps ranking, GBP optimization, technical SEO, and GEO / AIO / LLM search visibility."
    blocks:
      - heading: How my SEO services are structured
        body:
          - "Every engagement is built around a clear outcome, usually more qualified inbound calls, more booked jobs, or more pipeline-quality leads, and is broken into three coordinated workstreams: **Local SEO** (Google Business Profile + Maps), **Website SEO** (on-page + technical + content), and **AI Search Visibility** (GEO + AIO + LLM). You can hire any of them individually, but the strongest results come from running all three in parallel."
          - "The reason is simple. Google's local algorithm cross-checks your GBP against your website, and AI search engines pull from both. Working on one in isolation is like training one leg at the gym: you'll move forward, just slower and with a limp."
      - heading: Local SEO services in detail
        bullets:
          - "**Google Business Profile optimization**: categories, services, description, photos, posts, Q&A, products, attributes."
          - "**Google Maps ranking**: geo-grid analysis, proximity engineering, service-area expansion, map pack tracking."
          - "**GBP ranking maintenance**: weekly posts, photo cadence, owner Q&A, performance reporting on calls and directions."
          - "**Citation building and NAP consistency**: Apple Maps, Bing Places, Yelp, Facebook, Yellow Pages, industry directories."
          - "**Review and reputation strategy**: automated review requests, owner responses, sentiment monitoring."
          - "**Local landing pages**: one optimized page per city, neighbourhood or service area, with unique copy and schema."
      - heading: Website SEO and technical SEO
        body:
          - "A website that ranks in 2026 has to be fast, semantically rich, and structured so both Google and LLMs can read it without guessing. That means clean information architecture, real Core Web Vitals work, proper schema, and content written for both humans and the new generation of AI answer engines."
        bullets:
          - "**Technical SEO audit**: crawlability, indexation, canonicals, sitemaps, robots.txt, hreflang where relevant."
          - "**Core Web Vitals**: LCP, CLS, INP tuned to green on mobile and desktop."
          - "**On-page SEO**: titles, descriptions, headings, internal linking, image alts, semantic HTML."
          - "**Schema markup**: LocalBusiness, Service, FAQPage, Article, BreadcrumbList, Review, Product where applicable."
          - "**Content optimization**: search-intent matched copy, topic clusters, semantic SEO, content refresh cadence."
      - heading: "AI search visibility: GEO, AIO and LLM optimization"
        body:
          - "Generative Engine Optimization (GEO) and AI Overview Optimization (AIO) are the new front door. When a prospect asks ChatGPT or Gemini for the best Local SEO expert in Bangladesh, you want your business to be the one quoted, not your competitor. The mechanics are different from classic SEO: entity clarity, structured data, citation hygiene on the sources these models actually trust, and content written in clean question-and-answer blocks."
        bullets:
          - "Entity consolidation across website, GBP, Wikipedia-grade sources, and major directories."
          - "Schema enrichment to give LLMs unambiguous structured facts to quote."
          - "FAQ and Q&A content engineered to be extracted into AI answers."
          - "Brand citation building on the publications and aggregators LLMs train on."
      - heading: "Reporting, transparency, and what you actually get"
        body:
          - "Every client receives a monthly report covering geo-grid rankings, calls and direction requests from GBP, organic traffic and keyword movements, technical SEO health, and a clear next-month plan. No jargon, no inflated screenshots, just the numbers that map to revenue. You can see the kind of results this produces on the [case studies page](/case-studies)."
