  - type: prose
    eyebrow: Services in detail
    heading: "What each engagement covers"
    intro: "A plain breakdown of the work inside Local SEO, technical SEO and AI search visibility, and how the three fit together."
    blocks:
      - heading: How the work is structured
        body:
          - "Every engagement is built around one outcome, usually more qualified calls, bookings or direction requests, and split into three workstreams: **Local SEO** (Google Business Profile and Maps), **website SEO** (on-page, technical and content) and **AI search visibility** (GEO). You can hire any of them on its own, but they work best together."
          - "The reason is how Google ranks local results: on [relevance, distance and prominence](https://support.google.com/business/answer/7091). The profile, the website and your citations all feed relevance and prominence, and AI tools pull from the same sources. If you want the background first, the [Local SEO guide for Bangladesh businesses](/blog/local-seo-bangladesh-guide) explains it from the start."
      - heading: What Local SEO work includes
        bullets:
          - "**Google Business Profile**: primary and additional categories, services, products, description, attributes, regular and special hours, photos and Google Posts. My [GBP optimization checklist](/blog/google-business-profile-optimization-checklist) lists every field."
          - "**Google Maps ranking**: geo-grid baselines, accurate pin placement, service-area setup (up to 20 areas for a service-area business) and Map Pack tracking."
          - "**Profile health**: verification (including live video verification), suspension appeals, duplicate listings and unwanted suggested edits."
          - "**Citations and NAP**: Bing Places, Apple Business Connect, Facebook, Yelp and industry or country directories."
          - "**Reviews**: request links, replies to every review and monitoring, within Google's rules on incentivised and gated reviews."
          - "**Location and service pages**: one useful page per real service and area, with LocalBusiness schema."
      - heading: Website and technical SEO
        body:
          - "A site that supports local rankings has to load fast on mobile data, be crawlable and indexable, and state its business facts in structured data. That means clean architecture, real Core Web Vitals work and schema that matches what the page shows."
        bullets:
          - "**Crawling and indexing**: robots.txt, meta robots, XML sitemaps, canonical tags, hreflang where a site has language versions."
          - "**Core Web Vitals**: LCP, INP and CLS fixed on mobile first."
          - "**On-page SEO**: title tags, meta descriptions, H1s, internal links, image alt text."
          - "**Structured data**: LocalBusiness (or Dentist, Plumber, HVACBusiness and other subtypes), Service, FAQPage, BreadcrumbList, Article, Product where relevant."
      - heading: "AI search visibility (GEO)"
        body:
          - "When someone asks ChatGPT, Gemini, Perplexity or Bing Copilot for a recommendation, those tools lean on consistent facts from trusted sources. GEO makes your business easy to identify and quote: the same name, address, services and areas on your site, your profile and the directories they read. The [guide to AI search visibility for local businesses](/blog/ai-search-visibility-local-business) covers it in depth."
        bullets:
          - "Entity details made consistent across website, Business Profile and major directories."
          - "Schema with sameAs links so assistants can connect your profiles."
          - "Question-and-answer content that can be lifted into AI answers."
          - "Mentions on publications and directories that AI tools cite."
      - heading: "Reporting and what you get"
        body:
          - "Every client gets a monthly report: geo-grid rankings, calls and direction requests from the Business Profile, organic traffic and keyword movement from Search Console, technical health, and next month's plan. The proof section above shows what that reporting has looked like for real clients."
