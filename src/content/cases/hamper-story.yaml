intro:
  - "**Client:** Hamper Story, a Singapore-based Shopify store selling premium hampers online. **Goal:** organic growth that turns search visibility into revenue, so sales no longer depend on paid ads. **Work:** keyword research, Shopify on-page SEO, technical fixes, content and link building. **Timeline:** 16 months."
sections:
  - type: problems
    eyebrow: "01 · Problem"
    heading: "Why organic search was not selling hampers"
    intro: "Hamper Story was leaning almost entirely on paid ads to drive sales. Organic search barely contributed: there was no SEO plan, rankings were weak for buying searches like hampers and gift delivery in Singapore, and the product pages that did get traffic weren't built to convert it."
    items:
      - { title: "Low organic traffic", text: "Minimal search visibility for a store with real demand." }
      - { title: "No structured SEO strategy", text: "No plan in place to grow organic search as a channel." }
      - { title: "Over-reliance on paid ads", text: "Revenue depended almost entirely on paid advertising." }
      - { title: "Poor keyword rankings", text: "Weak positions for hamper-related searches in Singapore." }
      - { title: "Underperforming product pages", text: "Low CTR and weak conversion on the pages that mattered most." }
  - type: steps
    alt: true
    eyebrow: "02 · Approach"
    heading: "The Shopify SEO campaign, step by step"
    intro: "I ran a full-funnel SEO campaign built for a Singapore Shopify store, combining keyword research, [technical SEO](/technical-seo), on-page optimization, content and link building, then reviewed Google Search Console every week to decide the next change."
    items:
      - { title: Keyword Research, text: "Mapped high-intent hamper and gifting searches across Singapore, prioritizing terms with clear buying intent and realistic ranking potential." }
      - { title: "On-Page & Shopify SEO", text: "Optimized every product and collection page: title tags, meta descriptions, internal links, Product schema and conversion-focused copy to lift both rankings and click-through rate." }
      - { title: "Technical & Content", text: "Fixed site speed, crawlability and schema markup. Published seasonal gifting guides and hamper-focused blog posts to reach shoppers earlier in their search." }
      - { title: "Authority & Iteration", text: "Built links from Singapore-focused directories and gift blogs, then iterated weekly on Search Console data to compound rankings and revenue." }
  - type: stats
    eyebrow: "03 · Outcome"
    heading: "Results: traffic, sales and orders"
    intro: "In 16 months the store went from near-invisible in organic search to a serious revenue channel: 9.79K organic clicks, 379K impressions, 19,139 monthly sessions (+92%), $72,412 in monthly Shopify sales (+206%), and 319 orders in 30 days (+294%)."
    items:
      - { title: "Organic clicks (16 mo)", value: "9.79K" }
      - { title: "Total impressions", value: "379K" }
      - { title: "Monthly sales (SGD)", value: "$72,412" }
      - { title: "Orders in 30 days (+294%)", value: "319" }
      - { title: "Sessions growth · 19,139/mo", value: "+92%" }
      - { title: "Revenue increase · $34,928/mo", value: "+176%" }
  - type: images
    alt: true
    eyebrow: Real Screenshots
    heading: "The data behind the result"
    intro: "Unedited screenshots from Google Search Console and the Hamper Story Shopify admin."
    items:
      - { title: "Google Search Console · Performance", text: "9.79K total clicks, 379K impressions, 2.6% average CTR and 25.9 average position, with clicks and impressions climbing into a late-2023 peak.", image: "cases/hamper-gsc-16month.png" }
      - { title: "Google Search Console · 3-month comparison", text: "Last 3 months vs previous 3 months: clicks 3.39K vs 1.48K, impressions 118K vs 80.2K, CTR 2.9% vs 1.8%, average position 22.9 vs 29.1.", image: "cases/hamper-gsc-3month.png" }
      - { title: "Shopify · Store overview", text: "Last 30 days (Oct 22 to Nov 20, 2023): 19,139 sessions (+92%), $72,412 total sales (+206%), 319 total orders (+294%), 1.35% conversion rate (+96%).", image: "cases/hamper-shopify-overview.png" }
      - { title: "Shopify · Analytics", text: "October 2023 total sales of $34,928 (+176% vs September 2023), with Delivery & Pickup as the dominant sales channel.", image: "cases/hamper-october-sales.png" }
      - { title: "Shopify · Orders", text: "319 orders (+294%) and 364 ordered items (+219%) in the last 30 days, with a steady run of paid orders each day.", image: "cases/hamper-orders-30days.png" }
  - type: list
    eyebrow: "04 · Learnings"
    heading: "What this case study shows"
    bullets:
      - "**SEO compounds.** 16 months of steady work turned a store that lived on paid ads into one with a strong organic revenue channel."
      - "**On-page and Shopify-level optimization** moves rankings and conversion rate at the same time."
      - "**Local intent wins.** A Singapore-focused keyword and link plan beat generic gifting SEO."
    body:
      - "Organic SEO for a store follows the same discipline as my [TechicTalk content growth project](/case-studies/techictalk-organic-growth). To see how I split the work week to week, read [what an SEO specialist actually does](/blog/what-does-seo-specialist-do), or browse [all my SEO services](/services)."
