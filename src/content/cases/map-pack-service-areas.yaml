intro:
  - "**Client:** a home service business serving several nearby areas. **Focus:** Google Maps ranking across the whole service area, not just the office location. **Key result:** +38% Map Pack visibility, 5x more areas ranking in the Top 3 and +27% direction requests."
sections:
  - type: problems
    eyebrow: "01 · Problem"
    heading: "Strong in one zone, invisible in the next"
    intro: "Distance is one of Google's three local ranking factors, so a business usually ranks well close to its address and fades further out. This client ranked well in its home zone only. Customers searching from nearby neighbourhoods saw competitors in the Map Pack instead."
    items:
      - { title: "One-zone visibility", text: "Visible in the home zone, invisible in nearby areas it actually served." }
      - { title: "No geo-grid view", text: "Rankings were checked from one spot, so nobody could see where visibility dropped off." }
      - { title: "Weak service-area targeting", text: "Service-area pages weren't targeting the right places." }
      - { title: "Misaligned citations", text: "Citations not aligned with target areas." }
  - type: steps
    alt: true
    eyebrow: "02 · Approach"
    heading: "How I mapped and closed the coverage gaps"
    intro: "I measured visibility point by point across the service area first, then strengthened relevance and prominence signals for the specific areas where the business was weakest. This is the core of my [Local SEO service](/local-seo-service) for service-area businesses."
    items:
      - { title: Geo-Grid Tracking, text: "Set up geo-grid rank tracking: the same keyword checked from a grid of points across the service area, so every gap shows up on a map." }
      - { title: Local Keyword Mapping, text: "Mapped each target keyword to a specific area and page, so the website and the Google Business Profile sent matching signals." }
      - { title: Service-Area Optimization, text: "Updated the GBP service areas and categories through [Google Business Profile optimization](/google-business-profile-optimization), and rebuilt the supporting service-area pages." }
      - { title: Citation Cleanup, text: "Audited and cleaned citations so the business name, address and phone matched everywhere and listings pointed at the right areas." }
  - type: stats
    eyebrow: "03 · Outcome"
    heading: "Results across the service area"
    intro: "Map Pack coverage spread from one zone into the most important nearby areas, and more searchers asked Google Maps for directions to the business."
    items:
      - { title: "Map Pack visibility", value: "+38%" }
      - { title: "Areas ranking Top 3", value: "5x" }
      - { title: "Direction requests", value: "+27%" }
  - type: images
    alt: true
    eyebrow: Real Screenshot
    heading: "Geo-grid ranking view"
    items:
      - { title: "Geo-grid rank map", text: "A geo-grid scan across a service area north of Dallas, near Plano: every grid point ranks in positions 1 to 3, with a solid block of #1 positions through the middle and south.", image: "cases/geo-grid-ranking.jpg" }
  - type: list
    eyebrow: "04 · Learnings"
    heading: "What this case study shows"
    bullets:
      - "Local visibility is geographical. Track rankings by area, not just by keyword."
      - "Service-area businesses (plumbers, HVAC, cleaners, movers) gain the most from a geo-grid approach."
      - "Each area you close compounds, because reviews and calls from it feed prominence everywhere."
    body:
      - "For the wider ranking picture, read [how Local SEO helps businesses rank higher on Google Maps](/blog/local-seo-helps-businesses-rank-google-maps). If you run a trade, see my [SEO for home services](/seo-for-home-services) page."
