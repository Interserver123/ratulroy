intro:
  - "**Client:** a legitimate business with real market demand whose website was effectively invisible in Google. **Focus:** website SEO, content and technical fixes. **Timeline:** 6 months."
sections:
  - type: problems
    eyebrow: "01 · Problem"
    heading: The Challenge
    intro: "The client came to us with a website that was effectively invisible in Google, generating almost zero organic clicks despite a legitimate business with real market demand. There was no keyword strategy, outdated and unfocused content, serious technical SEO debt and a poor mobile experience dragging down every ranking signal."
    items:
      - { title: "Near-zero organic traffic", text: "Not ranking for any meaningful keywords." }
      - { title: "No keyword strategy", text: "Content existed but ignored search intent." }
      - { title: "Technical SEO debt", text: "Slow speeds, mobile issues and crawlability blockers." }
      - { title: "Content gaps", text: "High-intent topics with zero coverage on the site." }
  - type: steps
    alt: true
    eyebrow: "02 · Approach"
    heading: The Strategy
    intro: "We deployed a systematic, data-driven SEO framework designed to build organic momentum from the ground up, fixing the technical foundation first, then aligning content with real search intent and iterating weekly on Search Console data."
    items:
      - { title: "Audit & Gap Analysis", text: "Full technical, on-page and off-page audit. Every underperforming page and missed keyword opportunity catalogued and prioritized." }
      - { title: Keyword Architecture, text: "Rebuilt the keyword map: head terms paired with long-tail variations, each matched to a specific page with clear intent alignment." }
      - { title: Content Optimization, text: "Rewrote existing pages around target keywords and search intent, then shipped new pages to close the highest-value content gaps." }
      - { title: "Meta & CTR Testing", text: "Rewrote every title and meta description, A/B tested formats and pushed average CTR to 8.3%, well above industry benchmarks." }
  - type: stats
    eyebrow: "03 · Outcome"
    heading: The Result
    intro: "In 6 months organic clicks went from near-zero to 3.93K, impressions exploded to 47.4K, average CTR landed at 8.3%, and average position improved from 50+ to 26.8 with a clear upward trajectory toward page one."
    items:
      - { title: "Total clicks", value: "3.93K" }
      - { title: "Impressions", value: "47.4K" }
      - { title: "Average CTR", value: "8.3%" }
      - { title: "Average position (from 50+)", value: "26.8" }
  - type: images
    alt: true
    eyebrow: Real Screenshot
    heading: "The data behind the result"
    items:
      - { title: "Google Search Console", text: "May to November 2020: 3.93K clicks, 47.4K impressions, 8.3% average CTR and 26.8 average position, with clicks lifting off near-zero from late September.", image: "cases/data-driven-gsc.png" }
  - type: list
    eyebrow: "04 · Learnings"
    heading: Key Takeaways
    bullets:
      - "**Data-driven iteration wins.** Small weekly improvements compound into massive growth."
      - "**Content is the foundation.** Keyword-aligned content drove the biggest ranking lifts."
      - "**Technical SEO is non-negotiable.** No content strategy can outrun a broken crawl."
