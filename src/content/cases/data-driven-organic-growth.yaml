intro:
  - "**Client:** a legitimate business with real market demand whose website was effectively invisible in Google. **Focus:** website SEO: technical fixes, keyword mapping, content and title/meta rewrites. **Timeline:** 6 months. **Key result:** 3.93K clicks, 47.4K impressions, 8.3% CTR, average position from 50+ to 26.8."
sections:
  - type: problems
    eyebrow: "01 · Problem"
    heading: "Why a real business had almost no organic clicks"
    intro: "The website generated almost zero organic clicks even though people were searching for what the business sold. There was no keyword strategy, the content was outdated and unfocused, technical SEO problems blocked crawling, and a poor mobile experience held back every page."
    items:
      - { title: "Near-zero organic traffic", text: "Not ranking for any meaningful keywords." }
      - { title: "No keyword strategy", text: "Content existed but ignored search intent." }
      - { title: "Technical SEO debt", text: "Slow speeds, mobile issues and crawlability blockers." }
      - { title: "Content gaps", text: "High-intent topics with zero coverage on the site." }
  - type: steps
    alt: true
    eyebrow: "02 · Approach"
    heading: "The four-step method I used"
    intro: "I fixed the [technical SEO](/technical-seo) foundation first, then matched every page to real search intent, then reviewed Search Console every week and adjusted. Nothing was published or rewritten without data behind it."
    items:
      - { title: "Audit & Gap Analysis", text: "Full technical, on-page and off-page audit. Every underperforming page and missed keyword opportunity catalogued and prioritized." }
      - { title: Keyword Architecture, text: "Rebuilt the keyword map: head terms paired with long-tail variations, each assigned to one page with a clear search intent, so pages stopped competing with each other." }
      - { title: Content Optimization, text: "Rewrote existing pages around target keywords and search intent, then published new pages to close the highest-value content gaps." }
      - { title: "Meta & CTR Testing", text: "Rewrote every title tag and meta description, tested different formats and lifted average CTR to 8.3%." }
  - type: stats
    eyebrow: "03 · Outcome"
    heading: "Results after 6 months"
    intro: "In 6 months organic clicks went from near-zero to 3.93K, impressions grew to 47.4K, average CTR reached 8.3%, and average position improved from 50+ to 26.8, still climbing toward page one."
    items:
      - { title: "Total clicks", value: "3.93K" }
      - { title: "Impressions", value: "47.4K" }
      - { title: "Average CTR", value: "8.3%" }
      - { title: "Average position (from 50+)", value: "26.8" }
  - type: images
    alt: true
    eyebrow: Real Screenshot
    heading: "The data behind the result"
    items:
      - { title: "Google Search Console", text: "May to November 2020: 3.93K clicks, 47.4K impressions, 8.3% average CTR and 26.8 average position, with clicks lifting off near-zero from late September.", image: "cases/data-driven-gsc.png" }
  - type: list
    eyebrow: "04 · Learnings"
    heading: "What this case study shows"
    bullets:
      - "**Weekly iteration wins.** Small weekly improvements based on Search Console data add up fast."
      - "**Content is the foundation.** Pages matched to search intent drove the biggest ranking gains."
      - "**Technical SEO comes first.** No content plan can outrun a site Google cannot crawl properly."
    body:
      - "The same approach scaled much further in the [TechicTalk organic growth project](/case-studies/techictalk-organic-growth). If you are weighing who should do this work for you, read [SEO specialist vs agency in Bangladesh](/blog/seo-specialist-vs-agency-bangladesh), or see [all the services I offer](/services)."
