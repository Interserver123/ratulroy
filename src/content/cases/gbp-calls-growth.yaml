intro:
  - "**Client:** a local service business that relies on phone calls. **Focus:** Google Business Profile optimization, supported by the local landing page, citations and reviews. **Key result:** 461 calls from the Business Profile (April to August 2024), +62% profile interactions and Top 3 Map Pack positions for core service terms."
sections:
  - type: problems
    eyebrow: "01 · Problem"
    heading: "Why the profile was not getting calls"
    intro: "The business had a Google Business Profile, but Google had little reason to show it. The categories and services did not describe what the business actually did, the website gave the profile weak support, and reviews were thin. For high-intent local searches it sat outside the Map Pack, so the phone stayed quiet."
    items:
      - { title: "Incomplete GBP setup", text: "Primary and additional categories were incomplete, and the services list was missing core jobs." }
      - { title: "Weak landing page relevance", text: "The local landing page linked from the profile did little to confirm the services or the area served." }
      - { title: "Inconsistent citations", text: "Name, address and phone (NAP) details differed across directories." }
      - { title: "Thin review signals", text: "Few recent reviews, and older reviews had no owner replies." }
  - type: steps
    alt: true
    eyebrow: "02 · Approach"
    heading: "What I changed, in order"
    intro: "I ran a full [Google Business Profile optimization](/google-business-profile-optimization) and lined the website up behind it, working on the three things Google says drive local ranking: relevance, distance and prominence."
    items:
      - { title: GBP Optimization, text: "Reset the primary category, added the additional categories that genuinely applied, rebuilt the services list, rewrote the business description and added real photos and regular posts that match how local customers search." }
      - { title: Local Landing Page, text: "Rewrote the landing page the profile points to around the same services and area, with clear internal links and location signals so the website confirms what the profile says." }
      - { title: "Citations & NAP", text: "Cleaned up directory listings so the business name, address and phone number read the same everywhere Google looks." }
      - { title: Review Signals, text: "Set up a simple review request link and a reply routine, so new reviews kept arriving and every review got an owner response." }
  - type: stats
    eyebrow: "03 · Outcome"
    heading: "Results: calls, interactions and Map Pack positions"
    intro: "The profile moved into the Map Pack for core service searches and started producing calls every week. These figures come from Google Business Profile Performance."
    items:
      - { title: "Calls from GBP", value: "461" }
      - { title: "Profile interactions", value: "+62%" }
      - { title: "Map Pack for core terms", value: "Top 3" }
  - type: images
    alt: true
    eyebrow: Real Screenshot
    heading: "Calls from the Business Profile"
    items:
      - { title: "Google Business Profile · Calls", text: "April to August 2024: 461 calls made from the Business Profile, +205.3% vs April to August 2023, rising to 207 calls in August 2024 alone.", image: "cases/gbp-calls-performance.jpeg" }
  - type: list
    eyebrow: "04 · Learnings"
    heading: "What this case study shows"
    bullets:
      - "For local intent searches, a well-optimized Google Business Profile often brings in more calls than paid ads for the same budget."
      - "Service-area businesses rank best when the profile and the website say the same thing about services and areas."
      - "Recent reviews and owner replies help both ranking (prominence) and the customer's decision to call."
    body:
      - "The full method is in my [Google Business Profile optimization checklist](/blog/google-business-profile-optimization-checklist), and the citation side is covered in the [guide to local citations and NAP consistency](/blog/local-citations-nap-consistency-guide). If you run a trade or a clinic, see [how the approach changes by industry](/industries), or start with my [Local SEO service](/local-seo-service)."
