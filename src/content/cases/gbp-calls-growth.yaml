sections:
  - type: problems
    eyebrow: "01 · Problem"
    heading: The Challenge
    intro: "An under-optimized Google Business Profile with weak local relevance, missing service signals, and limited Google Maps visibility. The business was invisible in the map pack for high-intent local searches."
    items:
      - { title: "Incomplete GBP setup", text: "Incomplete GBP categories and services." }
      - { title: "Weak landing page relevance", text: "The local landing page did little to support the profile." }
      - { title: "Inconsistent citations", text: "Inconsistent citations and NAP signals across the web." }
      - { title: "Thin review signals", text: "Few recent reviews and poor response patterns." }
  - type: steps
    alt: true
    eyebrow: "02 · Approach"
    heading: The Strategy
    intro: "A complete [Google Business Profile optimization](/google-business-profile-optimization) aligned with local search intent and the website's on-page relevance."
    items:
      - { title: GBP Optimization, text: "Refined categories, services, business description, photos, and Q&A to match real local search intent." }
      - { title: Local Landing Page, text: "Improved on-page relevance, internal links, and location signals to support the GBP." }
      - { title: "Citations & NAP", text: "Cleaned up directory citations and aligned NAP across the web for consistency." }
      - { title: Review Signals, text: "Built a review request and response loop to compound trust over time." }
  - type: stats
    eyebrow: "03 · Outcome"
    heading: The Result
    intro: "Stronger Google Maps visibility, more profile engagement, and a steady stream of inbound calls from the Business Profile."
