intro:
  - "**Client:** TechicTalk, a brand-new tech media publication. **Market:** global English. **Work:** technical SEO, site architecture, topic clusters, internal linking and editorial backlinks. **Timeline:** 18 months, from a zero-traffic launch to 976K organic clicks."
sections:
  - type: problems
    eyebrow: "01 · Problem"
    heading: "Starting from zero against the biggest tech publishers"
    intro: "TechicTalk launched with zero domain authority, no backlinks, no rankings and no content plan. It was up against established publishers like TechCrunch, The Verge and Wired in one of the most crowded content markets online."
    items:
      - { title: "Zero authority, zero traffic", text: "Zero domain authority and no existing organic traffic." }
      - { title: "No content pipeline", text: "No keyword strategy or content production pipeline." }
      - { title: "Giant competitors", text: "Competing against giant tech publishers in the search results." }
      - { title: "Weak foundations", text: "No backlink profile and weak technical foundations." }
  - type: steps
    alt: true
    eyebrow: "02 · Approach"
    heading: "The four phases of the SEO plan"
    intro: "Rather than fight the big publications for their strongest keywords, I targeted content gaps where competition was weak, then moved into harder topics as authority grew. The first phase was pure [technical SEO](/technical-seo)."
    items:
      - { title: "Foundation (M1-M3)", text: "Full technical SEO audit, site architecture redesign, Core Web Vitals scores of 90+, schema markup, XML sitemaps and Google Search Console setup." }
      - { title: "Content Engine (M3-M8)", text: "Topic clusters covering 5,000+ keywords, 50+ SEO-optimized articles per month, pillar pages and a deliberate internal linking structure." }
      - { title: "Authority (M8-M14)", text: "Editorial backlinks from 200+ referring domains, guest posting, HARO outreach and social sharing to get new articles read and linked." }
      - { title: "Scale & Optimize (M14-M18)", text: "Head-term targeting, consolidating overlapping articles, featured snippet capture and expansion across global English markets." }
  - type: stats
    eyebrow: "03 · Outcome"
    heading: "Results after 18 months"
    intro: "In 18 months TechicTalk went from a zero-traffic launch to a major tech media player: 976K organic clicks, 30M+ impressions, 15,000+ ranking keywords, DR 45+, and $120K+/month in Semrush organic traffic value."
    items:
      - { title: "Organic clicks", value: "976K" }
      - { title: "Impressions", value: "30M+" }
      - { title: "Keywords ranked", value: "15K+" }
      - { title: "Domain Rating", value: "45+" }
  - type: images
    alt: true
    eyebrow: Real Screenshots
    heading: "How the growth started"
    intro: "Screenshots from the early months of the campaign (May to November 2021), when the growth curve first broke away from zero."
    items:
      - { title: "Google Search Console", text: "May to October 2021: 6.13K clicks and 376K impressions, with both lines climbing from near-zero into a sustained growth curve.", image: "cases/techictalk-gsc.png" }
      - { title: "Semrush · Domain Overview", text: "November 2021: Authority Score 33, 4.2K monthly organic traffic, 2.39K keywords and 2.5K backlinks from 551 referring domains, with traffic rising sharply from mid-2021.", image: "cases/techictalk-semrush-overview.png" }
      - { title: "Semrush · Organic Research", text: "735 ranking keywords in the US database (plus 292 IN and 149 UK), with informational how-to queries holding position 1.", image: "cases/techictalk-semrush-positions.png" }
      - { title: "Ahrefs · Site Explorer", text: "3.82K backlinks from 555 referring domains, 2.2K organic keywords and a referring-domain curve that shoots up after launch.", image: "cases/techictalk-ahrefs.png" }
  - type: list
    eyebrow: "04 · Learnings"
    heading: "What this case study shows"
    bullets:
      - "**Pick your battles.** Find the content gaps first, then move into harder keywords as authority builds."
      - "**Technical quality** multiplies the value of every article you publish."
      - "**Consistent execution and weekly data reviews** are what turned a new domain into a site with close to a million clicks."
    body:
      - "The same weekly, data-led process produced the [data-driven organic growth case study](/case-studies/data-driven-organic-growth). For a look at the day-to-day work behind it, read [what an SEO specialist does all day](/blog/what-does-seo-specialist-do). For publishers that now also want citations in ChatGPT and Gemini, see [Generative Engine Optimization](/generative-engine-optimization)."
