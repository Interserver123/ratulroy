faqHeading: "Frequently asked questions"
faqs:
  - { q: "How fast can plumbing SEO start producing calls?", a: "Because plumbing search intent is so urgent, ranking improvements convert to calls almost immediately. Most clients see meaningful call growth within 90 days of starting work." }
  - { q: "Do I need a brand new website?", a: "Usually not. Most plumbing sites just need restructuring, better service pages, schema, technical fixes, and a real Local SEO strategy layered on top of what already exists." }
  - { q: "Can I rank in multiple cities?", a: "Yes, but each city needs unique content, local proof, and a real reason for Google to associate you with it. Thin templated city pages will hurt you, not help." }
  - { q: "How important are reviews for plumbing SEO?", a: "Extremely. Review volume, velocity, recency, and keyword content are some of the strongest Local SEO ranking signals for plumbers." }
  - { q: "Do you handle GBP suspension issues?", a: "Yes. Reinstatement, duplicate cleanup, and category corrections are routine work for plumbing accounts." }
  - { q: "How do you measure results?", a: "Geo-grid Maps ranking, organic search traffic, call tracking, and form submissions, reported monthly with clear before/after comparisons." }
