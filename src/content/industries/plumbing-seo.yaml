      - "Plumbing is one of the core trades in my [home services SEO](/seo-for-home-services) work, alongside [HVAC SEO](/industries/hvac-seo), since many of the same households need both. If your profile isn't appearing at all, start with [why a business doesn't show up on Google Maps](/blog/why-my-business-not-showing-google-maps)."
