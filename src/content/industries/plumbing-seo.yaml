faqHeading: "Plumbing SEO questions"
faqs:
  - q: "How long does plumbing SEO take to work?"
    a: "Profile fixes such as categories, hours and services can change your visibility within weeks. Steady growth in calls usually takes 3 to 6 months, depending on how competitive your area is and how many genuine reviews you collect along the way."
  - q: "Should a plumber show their address on Google?"
    a: "Only if customers visit you there. Most plumbers are service-area businesses, so the address should be hidden and up to 20 service areas listed instead. Showing a home address you don't serve customers from is against Google's guidelines."
  - q: "Can I use a call tracking number on my Business Profile?"
    a: "Yes. Put the tracking number as the primary phone and your main business number as the additional phone. Keep your main number on your website and every citation so your NAP stays consistent. That way you can measure calls without confusing Google about which number belongs to you."
  - q: "How do I compete with fake plumbing listings?"
    a: "Report clear violations, such as virtual offices or stuffed names, through Google's tools and the Business Redressal form. At the same time, build reviews, photos and service pages so you rank on your own merits when they disappear."
  - q: "Do emergency plumbing pages really make a difference?"
    a: "Yes. Emergency searchers want proof you answer quickly: hours, response time, a call button and recent reviews. A dedicated emergency page gives Google and the customer a clear match for that intent, and it gives you a page to link from your profile."
