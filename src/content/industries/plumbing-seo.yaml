intro:
  - "Plumbing SEO is Local SEO for plumbers: making your Google Business Profile and website the ones Google shows when people nearby search \"plumber near me\", \"emergency plumber\", \"blocked drain\" or \"water leak repair\". Plumbing searches are urgent and phone-first, so ranking in the Map Pack and getting the call decide almost everything."
  - "Most plumbing jobs start with water where it shouldn't be. Nobody compares ten websites while the bathroom floods: they pick from the map and dial. My [Local SEO service](/local-seo-service) for plumbers focuses on the parts of that moment you can control, from the category on your profile to how fast your emergency page loads on mobile data."
sections:
  - type: problems
    eyebrow: The problem
    heading: "Why plumbers miss calls they should be getting"
    intro: "Plumbing is one of the most spam-heavy local categories. These are the problems that hold honest plumbers back."
    items:
      - title: "Fake and lead-gen listings crowd the map"
        text: "Listings with virtual addresses or names like \"24 Hour Emergency Plumber Near Me\" take spots in the 3-pack. They can be reported, but the lasting fix is a profile that out-earns them on reviews, relevance and real engagement."
      - title: "Your hours don't match your promise"
        text: "Your site says 24/7 but your profile shows 9 to 6, or the other way round. Google shows open businesses first for \"plumber open now\" searches, and a missed after-hours call costs you a review as well as a job."
      - title: "Call tracking broke your NAP"
        text: "A tracking number on your profile and a different number on your site and directories confuses Google about who you are. The tracking number belongs as the primary on the profile with your main number as the additional phone, and your main number everywhere else."
      - title: "Drain, leak and heater work share one page"
        text: "\"Blocked drain\", \"water heater repair\" and \"leaking pipe\" are three different searches. A single services page ranks for none of them."
  - type: cards
    alt: true
    columns: 3
    eyebrow: What's included
    heading: "What plumbing SEO includes"
    intro: "Most plumbing calls come straight from Maps, so the engagement begins with [Business Profile optimization](/google-business-profile-optimization) and then builds the website and citations that back it up."
    items:
      - title: "A Business Profile built for plumbing"
        text: "\"Plumber\" as the primary category, with Drainage service, Septic system service or Water damage restoration service added only for work you do. Every service listed, special hours for public holidays, a service area that matches where your vans go, and a booking or quote link."
      - title: "Plumbing service pages"
        text: "Dedicated pages for emergency plumbing, leak detection and repair, blocked drains and toilets, water heater and geyser installation, pipe fitting, bathroom and kitchen plumbing, and water pump or overhead tank work where relevant. Each answers cost, how long it takes and what to do while waiting."
      - title: "Plumber schema and fast mobile pages"
        text: "LocalBusiness markup with the Plumber subtype, areaServed, openingHoursSpecification and sameAs, plus Service and FAQPage markup. Pages that load fast on mobile data with a tap-to-call button above the fold."
      - title: "Citations and NAP consistency"
        text: "Your name, main phone and address (or service area) made identical across Bing Places, Apple Business Connect, Facebook, trade associations and local directories, with duplicates merged or removed."
      - title: "Reviews from real jobs"
        text: "A review link sent by SMS or WhatsApp right after the job, while the relief is fresh. Customers who mention \"burst pipe\" or \"blocked drain\" and their area help you rank for exactly those searches. Owner replies to every review, done without keyword stuffing."
      - title: "Job photos customers trust"
        text: "Photos of your plumbers on site, before and after shots of repairs, installed water heaters and your marked van. Real work uploaded regularly tells searchers, and Google, that you are active."
  - type: list
    eyebrow: Search behaviour
    heading: "How people search for a plumber"
    intro: "Plumbing intent splits into emergencies, planned jobs and price checks. Each needs its own page and message."
    bullets:
      - "**Emergency:** \"emergency plumber near me\", \"burst pipe repair\", \"plumber open now\". Speed and trust decide the call, so hours, response time and recent reviews must be visible."
      - "**Problem-led:** \"toilet keeps running\", \"low water pressure\", \"water heater not working\". These people describe the symptom, so your pages should name symptoms, not just services."
      - "**Planned work:** \"bathroom fitting\", \"water heater installation\", \"new pipeline for flat\". Slower decisions where photos and detailed reviews matter more."
      - "**Cost:** \"plumber call-out charge\", \"drain cleaning cost\". Honest price ranges earn the click and filter out time-wasters."
      - "**Local and Banglish:** in Dhaka people often search \"plumber in Mirpur\" or \"mistri near me\" and describe the fault in Bangla. Pages that read naturally to them convert better."
  - type: steps
    eyebrow: Ranking factors
    heading: "What decides plumbing rankings in the Map Pack"
    intro: "Relevance, distance and prominence, applied to how plumbing searches work."
    items:
      - title: "Primary category and services"
        text: "\"Plumber\" is usually right. The services list and service pages tell Google which plumbing jobs you handle, so a drain-cleaning search can match you."
      - title: "Being open when people search"
        text: "For \"open now\" and emergency searches, accurate hours matter. Only claim 24-hour service if someone actually answers the phone at 3 AM."
      - title: "Review recency and detail"
        text: "Plumbing reviews age quickly in the searcher's eyes. A steady flow of recent, detailed reviews beats a large but old total."
      - title: "Distance from the searcher"
        text: "Emergency searches are very proximity-driven. Geo-grid tracking shows where you drop out, and area pages plus local citations help extend your reach."
  - type: prose
    alt: true
    eyebrow: Proof
    heading: "How this plays out across a service area"
    body:
