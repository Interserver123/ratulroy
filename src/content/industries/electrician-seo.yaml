faqHeading: "Electrician SEO questions"
faqs:
  - q: "How long does SEO take for an electrician?"
    a: "Profile fixes such as categories, services and hours can improve visibility within weeks. Steady growth in calls, especially for bigger jobs like rewiring, usually takes 3 to 6 months depending on local competition and how quickly you collect reviews."
  - q: "How do I get more rewiring and installation jobs instead of small repairs?"
    a: "Build dedicated pages for those jobs, list them as services in your Business Profile, show photos of completed projects and ask those customers for reviews. Google matches what you show it, so a profile and site that only mention repairs will keep attracting repair calls."
  - q: "Should I show my electrical licence on my website?"
    a: "Yes, wherever licensing applies in your area. Customers check it before they call, and it supports the expertise and trust signals Google looks for. Add insurance details and years in trade too, and mention them in your Business Profile description."
  - q: "Can I rank for emergency electrician searches if I don't work 24/7?"
    a: "Only for the hours you actually answer. Set accurate hours and special hours in your profile. Claiming 24/7 and missing calls leads to poor reviews, which hurts ranking more than limited hours. Update special hours for public holidays too."
  - q: "What schema should an electrician website use?"
    a: "Use LocalBusiness markup with the Electrician subtype, including name, address or areaServed, phone, opening hours and sameAs links, plus Service markup for each job and FAQPage markup where you answer questions. Keep the details identical to your Business Profile."
