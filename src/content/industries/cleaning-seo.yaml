faqs:
  - { q: "How fast can a cleaning company see SEO results?", a: "Many cleaning businesses see Maps ranking improvements within 60-90 days. Booking growth usually follows within 3-5 months as visibility compounds." }
  - { q: "Should I focus on residential or commercial cleaning SEO?", a: "Both. The strategy includes separate service pages and GBP services for each segment, capturing both high-volume residential and high-value commercial searches." }
  - { q: "Do I need a new website?", a: "Usually not. Most cleaning sites just need restructuring, dedicated service pages, schema, technical fixes, and a proper Local SEO foundation." }
  - { q: "How do reviews affect cleaning business rankings?", a: "Reviews are one of the top 3 ranking factors for cleaning companies. Volume, recency, and keyword content in reviews all boost Maps position." }
  - { q: "Can I rank in multiple cities?", a: "Yes, with unique content and real service proof for each city. Templated city pages don't work; Google recognizes and ignores them." }
  - { q: "What metrics do you report on?", a: "Maps ranking positions, organic traffic, call tracking, form submissions, and review growth, all with month-over-month comparison." }
