intro:
  - "Roofing SEO is Local SEO for roofing contractors: getting your Google Business Profile and website in front of homeowners and property managers who search \"roof repair near me\", \"roof leak repair\", \"roof replacement cost\" or \"roofing contractor in [city]\", and giving them enough proof of past work to request a quote from you."
  - "Roofing is different from most trades. Fewer people search, each job is worth far more, and the buyer usually compares two or three roofers before signing. That means ranking is only half the job: the profile and website also have to win the comparison. My [Local SEO service](/local-seo-service) for roofers covers both."
sections:
  - type: problems
    eyebrow: The problem
    heading: "Why roofing contractors struggle in local search"
    intro: "The ranking problems in roofing come from low search volume, long decisions and a lot of short-lived competitors."
    items:
      - title: "Storm chasers and short-lived listings"
        text: "After a big storm or the start of monsoon season, new listings appear overnight, some with virtual addresses. Established roofers who haven't kept their profile active lose ground to them for weeks."
      - title: "Few reviews per year"
        text: "A roofer might finish 40 jobs a year, not 400. If you don't ask every single customer for a review, your total stays small and old, and homeowners notice."
      - title: "No proof of finished work"
        text: "Homeowners want to see roofs you've actually done, ideally on their street or in their suburb. A website with stock photos and no project pages loses the comparison even when it ranks."
      - title: "One page for every roofing service"
        text: "\"Roof leak repair\", \"metal roof installation\" and \"roof inspection\" are different searches with different buyers. A single page can't rank or convert for all of them."
  - type: cards
    alt: true
    columns: 3
    eyebrow: What's included
    heading: "What roofing SEO includes"
    intro: "We start with [Google Business Profile optimization for roofers](/google-business-profile-optimization) and then build the project proof and service pages that win the quote."
    items:
      - title: "Business Profile set up for roofing"
        text: "\"Roofing contractor\" as the primary category, with Gutter cleaning service, Siding contractor or Waterproofing service added only for work you do. Every roofing service listed, a quote or estimate link, and a service area covering the suburbs you want jobs in."
      - title: "Service pages by roof job"
        text: "Separate pages for roof repair, leak repair, full replacement, inspections, metal and tin roofing, flat roof and rooftop waterproofing, gutters, and storm or monsoon damage repair. Each explains cost factors, how long the job takes and what an inspection covers."
      - title: "Project pages and galleries"
        text: "Write-ups of real projects by area: the problem, the material used, before and after photos and the customer's review. These rank for local long-tail searches and win the side-by-side comparison."
      - title: "RoofingContractor schema"
        text: "LocalBusiness markup using the RoofingContractor subtype, with areaServed, openingHoursSpecification, priceRange and sameAs, plus Service markup for each roofing service and FAQPage markup where it fits."
      - title: "Reviews from every finished job"
        text: "A review request at handover, by SMS or WhatsApp, with a short note asking customers to mention what was done. Reviews that say \"replaced our leaking metal roof in Khulna\" carry far more weight than \"great job\"."
      - title: "Photos that show the work"
        text: "Crew on site with safety gear, roofs before and after, close-ups of flashing and materials, and finished drone shots where you have them. Upload steadily, label files sensibly, and skip stock images entirely."
  - type: list
    eyebrow: Search behaviour
    heading: "How homeowners search for a roofer"
    intro: "Roofing searches are either urgent (a leak) or considered (a replacement). Both need covering."
    bullets:
      - "**Urgent leaks:** \"roof leak repair near me\", \"emergency roofer\", \"water coming through ceiling\". These callers want someone this week, and they ring the first credible result."
      - "**Damage and insurance:** \"storm damage roof repair\", \"roof inspection for insurance claim\". Pages that explain the inspection and claim paperwork you provide build trust fast."
      - "**Replacement and cost:** \"roof replacement cost\", \"metal roof vs tile\", \"best roofing contractor in [city]\". Long research phase, so detailed pages and project galleries matter."
      - "**Waterproofing:** in Bangladesh, \"roof waterproofing service in Dhaka\" and \"chhad leak\" searches rise ahead of the monsoon. Rooftop waterproofing deserves its own page."
  - type: steps
    eyebrow: Ranking factors
    heading: "What decides roofing rankings"
    intro: "Google's relevance, distance and prominence factors, through a roofer's lens."
    items:
      - title: "Relevance from category and services"
        text: "The right primary category plus a full services list and matching pages tell Google which roofing jobs you do."
      - title: "Prominence from reviews and mentions"
        text: "Because roofers get fewer reviews, each one counts more. Mentions in local news, trade associations and supplier \"find a contractor\" pages add authority that thin competitors don't have."
      - title: "Distance across a wide area"
        text: "Roofers often travel further than other trades. Area pages backed by real projects in those areas are the honest way to rank beyond your base."
      - title: "Activity and freshness"
        text: "Regular posts, new project photos and fresh reviews show an active business, which matters most right after storms when new listings flood in."
  - type: prose
    alt: true
    eyebrow: Proof
    heading: "What this looks like in practice"
    body:
      - "Roofing results are measured in quote requests and won jobs, not raw traffic. The method I use is the one behind [improving Map Pack visibility across several service areas](/case-studies/map-pack-service-areas): geo-grid tracking to find where you vanish, then area pages, citations and reviews to fill the gaps. That project saw Map Pack visibility rise 38% and 5x as many areas reach the Top 3. Your numbers will depend on your market."
      - "Roofing sits within my [Local SEO for home services](/seo-for-home-services). It overlaps most with [electrician SEO](/industries/local-seo-for-electricians), since renovation jobs often need both trades. For background on how Maps ranking works, see [how Local SEO helps businesses rank on Google Maps](/blog/local-seo-helps-businesses-rank-google-maps)."
