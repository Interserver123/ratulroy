faqHeading: "Frequently asked questions"
faqs:
  - { q: "How long until roofing SEO pays back the investment?", a: "Roofing has such high job value that one or two extra closed roofs from organic leads usually covers an entire year of SEO. Most clients break even within 4-6 months and start running positive ROI after that." }
  - { q: "Do I need separate pages for each roofing material?", a: "Yes, if you want to rank for material-specific searches. \"Metal roof installation [city]\" and \"shingle roof replacement [city]\" are different queries and need dedicated pages with proper schema." }
  - { q: "Can I rank in storm-affected areas if my office isn't there?", a: "Yes, with service-area strategy, hyperlocal content, citations, and reviews. But it's harder than ranking close to your actual address, and it has to be built deliberately." }
  - { q: "How important is content marketing for roofing?", a: "Very. Buyers research roofing extensively before requesting a quote. Topical authority content captures them in research mode and gets them to your site before they even think to call competitors." }
  - { q: "Do you handle GBP issues for roofing?", a: "Yes. Suspensions, duplicate listings, and category disputes are common in roofing and are handled as part of normal engagements." }
  - { q: "Can SEO replace my lead-gen platform spend?", a: "That's the whole point. The goal is to reduce dependency on HomeAdvisor / Angi by owning the organic and Maps results that those platforms currently own." }
