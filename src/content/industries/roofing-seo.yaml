sections:
  - type: problems
    eyebrow: The problem
    heading: "Why roofing SEO matters for your business"
    intro: "The specific problems Local SEO solves for businesses in your industry."
    items:
      - { title: "Lead-gen companies are eating your margins", text: "HomeAdvisor, Angi, and similar lead-gen platforms outrank you and sell the same lead to 3 of your competitors. Local SEO lets you own the call directly." }
      - { title: "You can't rank for material-specific searches", text: "\"Metal roof installation\", \"flat roof repair\", \"shingle replacement\": these are buying-intent searches with no dedicated pages on your site to capture them." }
      - { title: "Storm-season searches go to competitors", text: "After every storm, search volume spikes for \"storm damage roof\" and \"emergency roof repair\". Without the right content and GBP signals, you miss the window." }
      - { title: "Insurance and inspection keywords are wide open", text: "Most roofing competitors ignore \"roof inspection for insurance\" and \"insurance claim roof\", keywords with extremely qualified buyer intent." }
  - type: cards
    alt: true
    columns: 3
    eyebrow: What's included
    heading: "What's included in this engagement"
    intro: "Every roofing SEO project covers the full Local SEO stack, tuned for your industry."
    items:
      - { title: "GBP optimization for roofing contractors", text: "Primary category (Roofing contractor), secondary categories, full service list, photo strategy showing real jobs, GBP posts tied to seasonality, and Q&A built around insurance, materials, and timelines." }
      - { title: "Service pages by job type and material", text: "Dedicated pages for roof repair, roof replacement, storm damage, shingle / metal / flat / tile / TPO roofing, gutter integration, and inspection, each with Service schema and clear estimate CTAs." }
      - { title: "City and neighborhood pages", text: "Local pages for the cities you serve, written around real local context (climate, common roof types in the area, recent storm events) instead of templated copy." }
      - { title: "Authority content and Topical Map", text: "Articles answering the questions buyers Google before getting a quote: cost ranges, material comparisons, insurance process, lifespan, signs of damage. These build E-E-A-T and intercept top-of-funnel traffic." }
      - { title: "Reviews and reputation strategy", text: "Process for capturing reviews from every completed job, response strategy that surfaces materials and neighborhoods, and reputation cleanup if existing reviews are working against you." }
      - { title: "Technical SEO and schema", text: "Schema (LocalBusiness, RoofingContractor, Service, FAQ, Article), performance, mobile, internal linking, and crawl health." }
  - type: steps
    eyebrow: Ranking factors
    heading: "The ranking factors that decide this niche"
    intro: "Not every Local SEO signal matters equally. These are the ones that move the needle in your industry."
    items:
      - { title: "Topical authority", text: "Roofing has dozens of related sub-topics. Sites that cover them deeply (materials, lifespans, insurance, code, ventilation) rank far better than thin sites with a single \"Services\" page." }
      - { title: "Photo signals on GBP", text: "Fresh photos of real jobs (before/after, drone shots, install in progress) outperform stock photos in both ranking and CTR for roofing queries." }
      - { title: "Review keywords", text: "Reviews mentioning specific materials, neighborhoods, and \"insurance claim\" / \"storm damage\" boost rankings for those exact buyer queries." }
      - { title: "Backlinks from local sources", text: "Local press, business directories, supplier sites, and chamber of commerce links carry more weight than generic links for roofing rankings." }
  - type: prose
    alt: true
    heading: "What this looks like in practice"
