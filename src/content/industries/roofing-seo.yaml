faqHeading: "Roofing SEO questions"
faqs:
  - q: "How long does roofing SEO take?"
    a: "Expect 3 to 6 months for steady movement in competitive areas. Roofing has fewer searches than plumbing or HVAC, so each ranking gain shows up as a handful of high-value quote requests rather than a flood of calls. Building reviews early speeds everything up."
  - q: "Which Google Business Profile category should a roofer use?"
    a: "\"Roofing contractor\" is the right primary category for most roofers. Add categories such as Gutter cleaning service or Waterproofing service only if you actually offer that work, because unrelated categories can dilute relevance. Check which categories the top-ranking roofers near you use as well."
  - q: "Should I create a page for each suburb I serve?"
    a: "Only where you have real work to show. A suburb page with photos and reviews from jobs there can rank and convert. Dozens of near-identical city pages tend to be ignored by Google and can hurt the site."
  - q: "Do project photos help roofing rankings?"
    a: "They help most with conversion. Homeowners compare roofers on visible proof, and profiles with real, recent photos tend to get more calls and website clicks, which supports your visibility over time. Add new photos after every finished job."
  - q: "How do I get more reviews when I only do a few jobs a month?"
    a: "Ask every customer at handover, make it one tap with a review link or QR code, and follow up once. Never offer discounts for reviews or only ask happy customers, as Google prohibits both. A short, polite reminder a week later is fine."
