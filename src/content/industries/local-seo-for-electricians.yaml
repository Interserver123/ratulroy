  - type: list
    nav: Search intent
    id: search-intent
    eyebrow: Search behaviour
    heading: "How customers search for an electrician"
    intro: "Electrical searches range from panic to planning. Each type needs its own page and its own call to action."
    bullets:
      - "**Emergency:** \"emergency electrician near me\", \"electrician open now\", \"power out in half the house\". Fast mobile pages, real hours and a one-tap call button decide who gets the job."
      - "**Symptom-led:** \"breaker keeps tripping\", \"outlet sparking\", \"burning smell from switch\". Pages that name the symptom and say what to do safely earn the call."
      - "**Project:** \"panel upgrade cost\", \"EV charger installation near me\", \"whole house rewire\", \"generator installer\". Comparison buyers who read reviews and want to see past work."
      - "**Commercial:** \"commercial electrician\", \"electrical contractor for restaurant\", \"office lighting retrofit\". Longer decisions that need credentials and references."
      - "**Local language:** in Bangladesh, searches mix English job names with Bangla, such as \"electric mistri near me\" or \"IPS installation Dhaka\". Pages should read naturally for both."

  - type: steps
    nav: Ranking factors
    id: ranking-factors
    eyebrow: Ranking factors
    heading: "What decides electrician rankings in Google Maps"
    intro: "Google ranks local results on relevance, distance and prominence. Here is what that means for an electrical contractor."
    items:
      - title: "Relevance: categories, services and pages"
        text: "Your primary category, services list and dedicated job pages tell Google you do panel upgrades or EV chargers, not just repairs. Without them you only match the generic term."
      - title: "Distance: your service-area reach"
        text: "Emergency searches favour nearby electricians. Geo-grid scans show exactly where you drop out, and area pages plus reviews from those areas extend your reach."
      - title: "Prominence: reviews, citations and links"
        text: "Recent, detailed reviews, consistent citations and mentions from suppliers, trade associations and local sites all raise prominence."
      - title: "Engagement: why searchers pick you"
        text: "Photos, review count, rating and a clear call option affect how many people choose your listing. Profiles that get chosen tend to keep being shown."

  - type: timeline
    nav: First 90 days
    id: plan
    eyebrow: The plan
    heading: "Your first 90 days of Local SEO"
