intro:
  - "**Local SEO for electricians** is the work that gets an electrical contractor's Google Business Profile and website into the Google Maps 3-pack and the local organic results when people nearby search for an electrician. It covers your Business Profile, service and service-area pages, reviews, citations and Electrician schema, and it is measured in calls, quote requests and booked jobs, not just rankings."
  - "Electrical searches come from two very different customers: the homeowner with a tripping breaker or a dead circuit who needs someone today, and the owner planning a panel upgrade, rewire or EV charger install who will compare three quotes. My [Local SEO service](/local-seo-service) for electricians builds profile signals and pages for both, so emergency calls keep the vans moving and bigger jobs fill the calendar."
sections:
  - type: problems
    nav: Problems
    id: problems
    eyebrow: The problem
    heading: "Why electricians miss out on Google Maps calls"
    intro: "These are the ranking and conversion problems I find most often when I audit electrical contractors."
    items:
      - title: "Only small repair jobs come in"
        text: "If your site and profile only say \"electrical services\", you rank for low-value fault calls and miss panel upgrade, rewiring, generator and EV charger searches that pay properly."
      - title: "Invisible a few miles from the shop"
        text: "Service-area businesses rank strongest near their verified address. Without area pages, reviews from customers further out and consistent citations, you disappear in the suburbs you actually drive to."
      - title: "No visible licence or insurance"
        text: "Electrical work is safety-critical. Customers look for a licence number, insurance and years in trade before they call. Hiding them costs you the click even when you rank."
      - title: "One generic services page"
        text: "\"Emergency electrician\", \"panel upgrade\", \"EV charger installer\" and \"commercial electrician\" are separate searches with separate intent. One page cannot match them all."
      - title: "Wrong or missing categories"
        text: "A primary category other than Electrician, or a profile with no services listed, tells Google you are something else. It is the most common reason a good electrician ranks below a weaker competitor."
      - title: "Paying for every lead"
        text: "Local Services Ads and Google Ads stop the day you stop paying. Without organic Maps visibility, every call has a cost and your marketing never compounds."

  - type: images
    nav: Results
    id: results
    eyebrow: Proof
    heading: "Electrician and home service results, straight from Google"
    intro: "Screenshots from real campaigns, alongside the case studies above. Client names are masked; the numbers are not."
    items:
      - { title: "Electrician SEO campaign: 12.2K clicks, 436K impressions", text: "Google Search Console for an electrician website. Clicks and impressions rose sharply once service pages, service-area pages and Business Profile fixes went live. Average position 5.9.", image: "results/home/electrician-seo-growth.png" }
