  - type: cards
    nav: What's included
    id: included
    alt: true
    columns: 3
    eyebrow: What's included
    heading: "What Local SEO for electricians includes"
    intro: "Most service calls start in Google Maps, so the work starts with [Google Business Profile optimization](/google-business-profile-optimization), then builds the pages and trust signals that keep you there."
    items:
      - title: "A Business Profile built for electrical work"
        text: "\"Electrician\" as the primary category, with Electrical installation service or Lighting contractor added only where they match real work. Every service listed, accurate hours (emergency hours only if you answer them), a service area, a quote link and a complete description."
      - title: "Service pages by electrical job"
        text: "Dedicated pages for emergency electrical repair, panel and fuse box upgrades, rewiring, lighting, generators, EV charger installation, inspections and commercial work. Each covers safety, timing, cost factors and a clear call button."
      - title: "Service-area pages that earn their place"
        text: "Pages for the towns and suburbs you serve, built on real jobs, photos and reviews from those areas. Not 50 copy-pasted city pages, which Google treats as doorway pages."
      - title: "Reviews that name the job and the area"
        text: "A simple review request after every job, by text or WhatsApp, prompting customers to mention what you fixed and where. \"Upgraded our 100 amp panel in Plano\" helps you rank for that work in that place. No incentives, no gating."
      - title: "Citations on the sites electricians are judged by"
        text: "Consistent name, address and phone on Bing Places, Apple Business Connect, Yelp, BBB, Angi, Nextdoor, Houzz and the trade directories in your country. Duplicates and old phone numbers cleaned up. See the [citations and NAP guide](/blog/local-citations-nap-consistency-guide)."
      - title: "Electrician schema and technical fixes"
        text: "LocalBusiness markup using the Electrician type with areaServed, opening hours, sameAs and your licence details, plus Service and FAQ markup. Fast mobile pages, click-to-call and indexing fixed, covered in [technical SEO](/technical-seo)."
      - title: "Licence, insurance and safety up front"
        text: "Licence number where your state or country issues one, insurance, years in trade and safety standards on the site and in your profile. This is what turns a Map Pack impression into a call."
      - title: "Photos of tidy, safe work"
        text: "Before and after shots of panels and wiring, finished lighting, installed chargers and generators, your team in PPE and your marked van. Real, geo-relevant photos build trust with both customers and Google."
      - title: "Tracking calls, not vanity rankings"
        text: "Geo-grid rank tracking across your service area, call and quote-request tracking, and a monthly report on which job types and areas are growing."

  - type: compare
    nav: SEO vs ads
    id: seo-vs-ads
    eyebrow: Where your calls come from
    heading: "Local SEO vs Local Services Ads vs Google Ads for electricians"
    intro: "All three can bring calls. Only one keeps working after you stop paying. Most electricians do best with Local SEO as the base and ads to fill gaps in quiet weeks."
    table:
