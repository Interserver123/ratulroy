    body:
      - "For an electrician, the numbers that matter are calls, quote requests and the mix of job types coming in. The approach is the one behind [a Google Business Profile that produced 461 calls in five months](/case-studies/gbp-calls-growth), up 205% on the year before, and [a service-area business that gained 38% Map Pack visibility](/case-studies/map-pack-service-areas) across the towns it serves. Those clients were call-driven local service businesses; I treat their results as proof of method, not a forecast for your area."
      - "Electrical work sits inside my [SEO for home service companies](/seo-for-home-services). It overlaps most with [HVAC SEO](/industries/hvac-seo), because AC and heat pump installs need dedicated circuits, and with [roofing SEO](/industries/roofing-seo) for renovation work. If your listing is not showing at all, start with [why a business doesn't show on Google Maps](/blog/why-my-business-not-showing-google-maps)."
