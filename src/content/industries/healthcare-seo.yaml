faqHeading: "Healthcare SEO questions"
faqs:
- q: "Should each doctor at my clinic have their own Google Business Profile?"
  a: "Google allows separate practitioner profiles for doctors who see patients directly, alongside the clinic's profile. It helps when patients search doctors by name. If a clinic has only one doctor, Google suggests a single profile using the practice name and doctor name together."
- q: "What is the best GBP category for a clinic?"
  a: "Choose the category that describes most of your patient visits: Medical clinic for general practice, a specialist category like Pediatrician for single-specialty practices, or Diagnostic center for test-led businesses. Add other categories only for services you actually provide."
- q: "Can I reply to negative patient reviews?"
  a: "Yes, but never confirm the person was a patient or mention any treatment detail. Thank them, state your standards in general terms, and invite them to contact the practice directly. Calm replies reassure the many people who read reviews before booking."
- q: "Should I publish test and consultation prices?"
  a: "If your pricing is stable, yes. Searches like \"CBC test price\" or \"consultation fee\" are common, especially in Bangladesh. Clear prices reduce phone queries and attract patients who are ready to book. Keep the prices on your site and profile in sync."
- q: "How do patients in Bangladesh search for doctors?"
  a: "Mostly on mobile, in English, Bangla or romanised Bangla, often by specialty and area, such as \"medicine specialist Mirpur\" or \"gynae doctor Uttara\". Many also search a doctor's name plus \"chamber\" or \"serial\" to find where and how to book."
- q: "How long does healthcare SEO take?"
  a: "Most practices see Maps movement in 3 to 6 months and steady booking growth after 6 to 9 months. New clinics and crowded areas like Dhanmondi or Panthapath take longer because of the number of established competitors nearby."
