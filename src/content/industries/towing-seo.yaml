sections:
- type: problems
  nav: Problems
  eyebrow: Where calls go
  heading: "Why towing companies lose emergency calls"
  items:
  - title: "Suspended or never verified"
    text: "Towing is one of the categories Google watches most closely for spam. Profiles with a virtual office, a keyword-stuffed name or an address customers cannot visit get suspended, often without warning. Getting verification and setup right is the core of my [Google Business Profile optimization](/google-business-profile-optimization) for tow operators."
  - title: "Lead-gen listings crowding the map"
    text: "Call centres create fake \"towing\" listings and sell the calls to whichever operator answers. They push real local companies down. Reporting them helps, but a complete, verified, active profile is what holds your position."
  - title: "Hours that say closed"
    text: "If your profile does not show \"Open 24 hours\", or Eid and public holiday hours are missing, Google may show you as closed at exactly the moment a driver needs you."
  - title: "Motor club dispatch with thin margins"
    text: "AAA and insurance dispatch keep trucks moving, but at their rates. Direct calls from search let you price your own work and build repeat relationships with drivers and fleets."
- type: cards
  nav: What I do
  alt: true
  columns: 3
  eyebrow: What's included
  heading: "What towing SEO includes"
  items:
  - title: "Verification and profile setup"
    text: "Towing service as primary category, your real legal or trading name, address hidden if customers do not come to you, up to 20 service areas, 24-hour regular hours and special hours for holidays. Ready for video verification if Google asks."
  - title: "Service pages by job type"
    text: "Emergency towing, flatbed towing, wheel-lift towing, motorcycle towing, heavy-duty and truck towing, accident recovery, winching, jump starts, car lockouts, flat tyre changes and fuel delivery. Each page leads with the phone number."
  - title: "Road and area coverage pages"
    text: "Pages for the highways, ring roads and districts you cover, such as towing on the Dhaka to Chattogram highway, with typical response areas and where you keep trucks."
  - title: "Schema for an automotive business"
    text: "AutomotiveBusiness markup with areaServed, openingHoursSpecification set to all day, every day, telephone, and a Service entry for each towing and roadside job."
  - title: "Photos that prove you are real"
    text: "Your branded trucks, flatbeds loaded at night, operators in hi-vis, your yard and equipment. Blur customer plates and faces. Real fleet photos also support your case if the profile is ever reviewed."
  - title: "Call tracking without NAP damage"
    text: "If you use a tracking number, set it as the primary phone and keep your main line as an additional number, so citations and the profile still match. Calls are measured without breaking NAP consistency."
- type: steps
  nav: Ranking factors
  eyebrow: What Google weighs
  heading: "Ranking factors that decide towing searches"
  intro: "Google ranks local results on relevance, distance and prominence. In towing, distance from the searcher is very strong, because drivers search from where they broke down."
  items:
  - title: "Distance and service-area coverage"
    text: "You will rank best near your base. Reviews from drivers across your area, coverage pages and local citations help you show up further along the roads you serve."
  - title: "Open-now status"
    text: "Google filters and highlights businesses open at the time of the search. Correct 24-hour and holiday hours keep you eligible for night and weekend calls."
  - title: "Review recency and replies"
    text: "Ask by text message after drop-off, while the help is fresh. Reviews that mention the vehicle, the location and the response time carry more weight. Reply to every one, including the angry ones."
  - title: "Mobile speed and one-tap calling"
    text: "The searcher is on a phone at the roadside, maybe on weak mobile data. A light page with the number at the top and a tap-to-call button wins the call."
