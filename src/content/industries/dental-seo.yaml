intro:
  - "Dental is one of the most predictable Local SEO niches when it's done correctly. Patients almost always pick from the first 3 results in Google Maps, they read reviews carefully, and they call clinics that look modern, trustworthy, and close."
  - "The clinics that consistently win are the ones with strong GBPs, well-built service pages for each procedure, and a real review acquisition system. Most dental websites are still built like brochures. That's the opportunity."
sections:
  - type: problems
    eyebrow: The problem
    heading: "Why dental SEO matters for your business"
    intro: "The specific problems Local SEO solves for businesses in your industry."
    items:
      - { title: "You're losing implant and Invisalign leads", text: "These are your highest-value procedures, but your site has one generic \"Services\" page instead of dedicated pages that can rank for the actual searches." }
      - { title: "Reviews are uneven or stale", text: "Your competitors have 200+ recent reviews and you have 40. Patients see the gap immediately, and so does Google's ranking algorithm." }
      - { title: "Your GBP looks generic", text: "Same primary category as every other clinic, no secondary categories, no service list, no posts, no photos. Patients can't tell you apart from anyone else." }
      - { title: "Emergency dental searches go elsewhere", text: "\"Emergency dentist\", \"toothache near me\", \"weekend dentist\": high-intent, high-margin searches that you're not capturing." }
  - type: cards
    alt: true
    columns: 3
    eyebrow: What's included
    heading: "What's included in this engagement"
    intro: "Every dental SEO project covers the full Local SEO stack, tuned for your industry."
    items:
      - { title: "GBP optimization for dental clinics", text: "Primary category (Dentist) plus relevant specialties (Cosmetic dentist, Pediatric dentist, Dental implants periodontist, Orthodontist, Emergency dental service), full service list, photo strategy, GBP posts, and Q&A seeded with patient questions." }
      - { title: "Procedure-specific service pages", text: "Dedicated pages for implants, Invisalign / clear aligners, veneers, cosmetic dentistry, teeth whitening, root canal, crowns, and emergency dental, each with Service schema, FAQ schema, and clear booking CTAs." }
      - { title: "Patient-trust content", text: "Pricing guidance, financing, insurance, and what-to-expect content that builds E-E-A-T and reduces friction before a patient even calls." }
      - { title: "Review system", text: "Post-appointment review acquisition with friendly prompts, response templates that surface procedures and neighborhoods naturally, and reputation monitoring." }
      - { title: "Technical SEO and schema", text: "MedicalBusiness / Dentist schema, FAQ schema, Service schema, performance, mobile booking flow, internal linking: everything that lets the content actually rank." }
      - { title: "Local citations and authority", text: "Dental-specific directories, healthcare aggregators, NAP consistency, and trustworthy local backlinks." }
  - type: steps
    eyebrow: Ranking factors
    heading: "The ranking factors that decide this niche"
    intro: "Not every Local SEO signal matters equally. These are the ones that move the needle in your industry."
    items:
      - { title: "E-E-A-T (experience, expertise, authority, trust)", text: "Dental is YMYL (Your Money Your Life). Google weights expertise signals (credentials, doctor bios with schema, real photos, accurate medical content) more heavily than in other niches." }
      - { title: "Review depth and recency", text: "Patients filter clinics by review count and recency before they even read the reviews. Both are ranking signals and conversion signals." }
      - { title: "Specialty categorization", text: "Clinics that list secondary categories matching the procedures they actually offer (implants, cosmetic, ortho, emergency) rank far better for those high-value searches." }
      - { title: "Booking signals", text: "Easy online booking, click-to-call prominence, and clear hours improve both ranking and conversion in the local pack." }
