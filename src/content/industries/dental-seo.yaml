faqHeading: "Dental SEO questions"
faqs:
  - q: "How long does dental SEO take to bring new patients?"
    a: "Fixes to categories, duplicates and hours can improve visibility within weeks. Steady growth in new-patient calls and bookings usually takes 3 to 6 months, depending on how many clinics compete near you and how quickly you build reviews."
  - q: "Should I use Dentist or Dental clinic as my primary category?"
    a: "Both are valid. \"Dentist\" usually fits a practice built around one or two dentists, while \"Dental clinic\" suits larger clinics with several practitioners. Check which category the top-ranking clinics near you use, then choose what genuinely describes your practice."
  - q: "Should each dentist in my clinic have their own Google profile?"
    a: "Google allows practitioner listings for public-facing professionals. They can help a well-known dentist, but they also split reviews. For most clinics, one strong clinic profile plus carefully managed practitioner listings works best, with each dentist named and linked on the clinic website."
  - q: "How should a dental clinic reply to a negative review?"
    a: "Reply calmly, don't confirm the person is a patient or mention any treatment, and invite them to call the clinic directly. Patient privacy comes first. A measured reply also reassures the people reading it later."
  - q: "Can I publish treatment prices on my website?"
    a: "Yes, and patients appreciate it. Ranges for scaling, fillings, root canal or implants answer common cost searches. Make clear that the final price depends on an examination, and list treatments with prices in your Business Profile services as well."
