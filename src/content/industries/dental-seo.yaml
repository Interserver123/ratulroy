faqs:
  - { q: "How long until dental SEO produces new patients?", a: "Most dental clinics see meaningful ranking improvements within 90 days and a clear uptick in new-patient calls within 4-6 months. Implants and Invisalign rankings usually take a little longer because the competition is heavier." }
  - { q: "Do I need separate pages for implants, Invisalign, etc.?", a: "Yes. These are high-value, high-intent searches that need dedicated pages with their own content, schema, and conversion paths. A single \"Services\" page won't rank for them." }
  - { q: "How important are reviews for dental SEO?", a: "Very. Dental is one of the niches where review count, velocity, recency, and content matter most. A consistent review acquisition system is non-negotiable." }
  - { q: "Will SEO comply with patient privacy and ad rules?", a: "Yes. Everything is built around publicly available marketing content, with no PHI, no patient data, and within standard healthcare advertising norms." }
  - { q: "Can I rank for multiple locations?", a: "Yes. Each location needs its own GBP, its own location page, and its own review strategy. Multi-location dental SEO is a normal scope." }
  - { q: "Do you also run ads for dental clinics?", a: "No. Local SEO only. The goal is to reduce paid-ad dependency by owning Maps and organic results." }
