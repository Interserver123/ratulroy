  eyebrow: Why it matters
  heading: Why construction SEO matters for your business
  intro: The specific problems Local SEO solves for businesses in your industry.
  items:
  - title: You're invisible to commercial project owners
    text: When a facilities manager searches "commercial construction company near me", they call the top 3. If you're not there, you're not in consideration.
  - title: Your website doesn't showcase projects
    text: Construction buyers want proof. A generic services page doesn't build trust the way detailed project pages with photos, specs, and outcomes do.
  - title: Competitors rank for your own project types
    text: Other firms in your city outrank you for "office renovation", "warehouse construction", and "tenant improvement", even when you've done more of that work.
  - title: RFP portals drain your margins
    text: Relying on public RFP sites means competing on price with 10+ other contractors. Local SEO brings direct inquiries where you set the terms.
