faqHeading: "Construction SEO questions"
faqs:
- q: "What is the best Google Business Profile category for a construction company?"
  a: "Construction company or General contractor is usually the right primary category for commercial builders. Add Concrete contractor, Excavating contractor or Demolition contractor only if you actually offer that work as a service, because unrelated categories can dilute relevance."
- q: "How long does SEO take for a construction firm?"
  a: "Expect ranking movement in 3 to 6 months and meaningful inquiry growth in 6 to 9 months. Construction buyers research slowly, so the first results often show as more profile views and project page visits before the calls increase."
- q: "Should I show project costs on my website?"
  a: "Show cost ranges or cost drivers if you are comfortable doing so. Searches like \"warehouse construction cost per square foot\" are common, and a page that explains what moves the price attracts buyers earlier in their research."
- q: "Can one website target both commercial and residential construction?"
  a: "Yes, with separate service pages and a clear navigation split. Keep one Google Business Profile per real office and choose the primary category that matches most of your revenue. Link each segment from the homepage so Google and visitors see both clearly."
- q: "Do construction companies need reviews if most work comes from referrals?"
  a: "Yes. Referred buyers still search your name on Google before calling. A profile with recent, detailed reviews from project managers confirms the referral, while an empty profile raises questions. Ask at handover, when the client's project manager is most satisfied."
- q: "How do AI tools like ChatGPT and Gemini pick construction firms to mention?"
  a: "They draw on consistent facts found across your site, your Google Business Profile, directories and news mentions. Clear project pages with sector, size and location make it easier for these tools to describe and cite your firm."
