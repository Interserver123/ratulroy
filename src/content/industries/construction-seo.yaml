- type: cards
  nav: What I do
  alt: true
  columns: 3
  eyebrow: What's included
  heading: "What construction SEO includes"
  intro: "Every part is built around one goal: when a buyer researches firms for a project like yours, your name keeps appearing with evidence attached."
  items:
  - title: "GBP categories and services"
    text: "Primary category set to Construction company or General contractor, with additional categories only where they are true (Concrete contractor, Excavating contractor, Demolition contractor, Civil engineering company). Services listed by project type, with your real office address and hours."
  - title: "Project-type landing pages"
    text: "Separate pages for industrial construction, warehouse construction, commercial building, office fit-out, design and build, and steel structure work, each linking to finished projects of that type."
  - title: "Project case study pages"
    text: "One page per notable project: sector, location, built area, scope, duration and what made it hard. These pages answer research queries and give AI Overviews something concrete to cite."
  - title: "Schema and entity signals"
    text: "GeneralContractor (a HomeAndConstructionBusiness subtype) or Organization markup with address, geo, areaServed, sameAs links to your LinkedIn and directory profiles, plus Service and BreadcrumbList on project pages."
  - title: "B2B citations and mentions"
    text: "Consistent NAP on chamber of commerce listings, trade association directories, Bing Places, Apple Business Connect and industry platforms. In Bangladesh that includes business directories procurement teams check before calling."
  - title: "Reviews from project stakeholders"
    text: "Review requests sent at handover to the client's project manager, with replies that mention the building type and location. A few detailed reviews from real clients beat dozens of one-liners."
- type: steps
  nav: Ranking factors
  eyebrow: What Google weighs
  heading: "Ranking factors that matter most for construction firms"
  intro: "Google ranks local results on relevance, distance and prominence. For construction, relevance and prominence do most of the work because buyers will travel for the right builder."
  items:
  - title: "Relevance through project-type depth"
    text: "Pages that name the exact work (pre-engineered steel buildings, RCC frame structures, tenant fit-out) match the long, specific queries commercial buyers type."
  - title: "Prominence from mentions and links"
    text: "Coverage in local business news, supplier case studies, association member lists and architect partner pages builds the authority a single profile cannot."
  - title: "Photos that show scale"
    text: "Upload site progress photos, drone shots of finished structures and team photos with safety gear. Label files and captions with the project type and area, not stock imagery."
  - title: "Consistent entity data"
    text: "The same company name, address and phone across your website footer, GBP, LinkedIn and directories. Firms with several legal names or old site-office addresses confuse Google about which entity to rank. My guide to [cleaning up citations and NAP data](/blog/local-citations-nap-consistency-guide) covers the fix."
