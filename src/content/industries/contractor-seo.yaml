    title: "Checking proof before the call"
    text: "They open your profile and website, look at before and after photos of a similar room, and read reviews that mention their kind of project."
    meta: "A call or quote request instead of a back button"
- type: problems
  nav: Problems
  eyebrow: Where leads leak
  heading: "Why remodeling contractors lose leads to competitors"
  items:
  - title: "Shared leads from marketplaces"
    text: "Angi, Thumbtack and HomeAdvisor send the same homeowner to several contractors. You win on price or not at all. Leads from your own Google Business Profile come to you alone."
  - title: "A profile that says \"Contractor\" and nothing else"
    text: "Without Remodeler, Kitchen remodeler or Bathroom remodeler as additional categories, and without services listed by room, Google has little reason to show you for specific remodel searches. My [Google Business Profile optimization](/google-business-profile-optimization) starts here."
  - title: "One services page for everything"
    text: "Kitchens, bathrooms, basements, additions and full-home renovations all have different search terms and different buyers. One generic page ranks for none of them."
  - title: "Photos with no story"
    text: "Finished-room photos without the \"before\" give homeowners nothing to compare. They need to see the problem you solved in a room like theirs."
- type: cards
  nav: What I do
  alt: true
  columns: 3
  eyebrow: What's included
  heading: "What remodeling contractor SEO includes"
  items:
  - title: "GBP categories and services"
    text: "General contractor or Remodeler as primary, with Kitchen remodeler, Bathroom remodeler or Home builder added only when they match real work. Services listed by project type with short descriptions, and a service area set to the areas you actually drive to."
  - title: "Project-type pages"
    text: "Kitchen remodeling, bathroom renovation, home additions, basement finishing, flooring, full-home renovation and, for Bangladesh clients, apartment interior renovation. Each page has cost drivers, timeline, a process outline and matching projects."
  - title: "Neighbourhood project pages"
    text: "Short write-ups of finished jobs by area (\"bathroom remodel in Dhanmondi\") with real photos. They prove you work there without the thin, copy-paste city pages Google ignores."
  - title: "Before and after photo routine"
    text: "Shoot the same angle before, during and after every job. Upload to your profile within a week of finishing, name the files by room and area, and use the best sets on project pages."
  - title: "Review requests at the walkthrough"
    text: "Ask at the final walkthrough when the homeowner is happiest, using a direct review link or QR card. Encourage them to mention the room and the area. No discounts for reviews, which breaks Google policy."
  - title: "Schema, speed and citations"
    text: "GeneralContractor schema with areaServed and sameAs, Service markup per project type, fast mobile pages and consistent NAP on Bing Places, Apple Business Connect, Houzz and local directories."
- type: steps
  nav: Ranking factors
  eyebrow: What Google weighs
  heading: "Ranking factors that decide remodeling searches"
  intro: "Google ranks local results on relevance, distance and prominence. For remodelers, distance matters more than for commercial builders, because homeowners prefer someone close by."
  items:
  - title: "Category and service match"
    text: "The right primary and additional categories, plus a services list that names each project type, decide whether you appear for \"kitchen remodeler\" or only for \"contractor\"."
  - title: "Reviews that describe the job"
    text: "A review that says \"they redid our bathroom in Banani in three weeks\" helps more than \"great service\". Recency matters too, because remodeling buyers distrust profiles with no reviews this year."
  - title: "Service-area reach"
    text: "Your address anchors your Map Pack visibility. Project pages, local citations and reviews from surrounding areas help you appear further out. Geo-grid tracking shows where you rank street by street."
  - title: "Proof on the landing page"
    text: "When the profile links to a page with matching project photos and clear contact options, more visitors call, and that engagement supports your visibility."
