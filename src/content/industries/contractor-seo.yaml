faqHeading: "Contractor SEO questions"
faqs:
- q: "What is the difference between a general contractor and a construction company on Google?"
  a: "On Google, the two often share the General contractor category, but the searches differ. Remodelers win homeowner searches like \"kitchen remodel near me\", while construction firms target commercial searches like \"warehouse construction company\". Your categories, services and pages should match the work you want."
- q: "Should I list Kitchen remodeler and Bathroom remodeler as categories?"
  a: "Yes, as additional categories, if those projects are a real part of your business. Keep General contractor or Remodeler as the primary category so you still appear for broader renovation searches. List each project type in the services section as well, with a short description."
- q: "Can I rank in neighbourhoods where I do not have an office?"
  a: "Yes, within reason. Set those areas in your profile's service area, publish real project write-ups from them, and collect reviews from clients there. Do not create fake addresses or virtual offices, which leads to suspension and can remove your profile from Maps entirely."
- q: "Should I put remodeling prices on my website?"
  a: "Give ranges and explain what changes the price, such as materials, layout changes and plumbing moves. Cost searches are among the most common remodeling queries, and a clear page earns calls from homeowners who already accept your range."
- q: "Do I still need Angi or Thumbtack?"
  a: "They can fill gaps while your own visibility grows. Over time, leads from your Google Business Profile and website cost less and are not shared with competitors, so most contractors reduce marketplace spend as Local SEO matures."
- q: "How many before and after photos should I upload?"
  a: "Add a new set after every finished job rather than a large batch once a year. Regular uploads keep the profile active, and homeowners look for photos of rooms similar to theirs. Shoot each set from the same angle so the change is obvious at a glance."
