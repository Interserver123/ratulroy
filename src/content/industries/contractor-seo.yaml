faqHeading: Frequently asked questions
faqs:
- q: How long until contractors see SEO results?
  a: Most contractors see Maps ranking improvements within 3-5 months and a meaningful increase in project inquiries by month 6. Competitive markets may take longer.
- q: Do I need a portfolio on my website?
  a: Yes. Project photos and case studies are critical for both ranking and conversion. They signal real work to Google and build trust with homeowners.
- q: Can I rank for both remodeling and new construction?
  a: Yes. The strategy includes separate service pages, GBP services, and content for each, capturing both renovation and new-build searches.
- q: How do you measure success for contractors?
  a: Maps ranking positions, organic traffic, call volume, form submissions, and the quality of project inquiries, all reported monthly with clear trends.
- q: Should I still use lead-gen sites?
  a: They're fine as a supplement, but Local SEO builds your own direct inquiry channel, one you own and don't share with competitors.
- q: What if my market is very competitive?
  a: Competitive markets require more depth and consistency, but the fundamentals work everywhere. The key is out-executing competitors on content, reviews, and citations.
