- type: timeline
  nav: How homeowners search
  eyebrow: The homeowner's path
  heading: "How homeowners search for a remodeling contractor"
  intro: "Remodeling is a planned purchase. Homeowners move through three stages, and your pages need to show up at each one."
  items:
  - label: "Weeks before hiring"
    title: "Ideas and cost research"
    text: "\"Kitchen remodel cost\", \"how long does a bathroom renovation take\", \"flat renovation ideas Dhaka\". A cost guide page per project type catches these searches before the homeowner is ready to call."
