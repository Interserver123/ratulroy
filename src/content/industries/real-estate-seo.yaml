faqHeading: "Real estate SEO questions"
faqs:
- q: "Should each real estate agent have their own Google Business Profile?"
  a: "Google allows individual practitioner profiles for agents who deal with clients directly, alongside the agency's profile. Each agent profile should use the agent's real name and the Real estate agent category, and be removed or updated when an agent leaves."
- q: "Can I outrank Zillow or property portals?"
  a: "Rarely for broad listing searches. You can win neighbourhood, agent and seller searches, plus the Map Pack for \"real estate agent near me\". Those searches come from people who want a specific person to help them."
- q: "What should a neighbourhood page include?"
  a: "Housing types, typical prices or price per square foot, schools, transport links, everyday convenience, known downsides and recent deals you handled there. Write it the way you would brief a client over coffee, and update prices at least once a year."
- q: "Do property developers need Local SEO?"
  a: "Yes. Buyers search the developer's name, the project name and the area. A Real estate developer profile for your sales office, plus clear project pages, makes sure they find accurate details instead of outdated portal ads."
- q: "How do I get more reviews when I close only a few deals a year?"
  a: "Ask every buyer and seller at handover, and ask landlords and tenants on rental deals too. A short, direct review link sent the same day works best. Small numbers of detailed reviews still build trust."
- q: "How long does real estate SEO take?"
  a: "Most agents see Maps and neighbourhood ranking movement in 3 to 6 months, with steady lead growth from month 6 onward. Seller leads usually arrive later than buyer inquiries because sellers research longer. Neighbourhood pages usually show results before valuation pages do."
