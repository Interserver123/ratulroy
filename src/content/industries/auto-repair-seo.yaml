faqs:
  - { q: "How long does auto repair SEO take?", a: "Most auto repair shops see ranking improvements within 60-90 days and meaningful call growth within 3-5 months. Competitive markets may take a bit longer." }
  - { q: "Can I rank without a huge marketing budget?", a: "Yes. Local SEO is about precision and consistency, not spend. A well-optimized GBP, targeted pages, and steady reviews can outrank bigger-budget competitors." }
  - { q: "Do I need separate pages for every service?", a: "For your core services (brakes, oil changes, transmission), yes. These pages capture the specific searches that drive the most revenue." }
  - { q: "How important are reviews for auto repair SEO?", a: "Critical. Auto repair is high-trust. Review count, recency, and content all directly impact Maps ranking and click-through rate." }
  - { q: "Can you help with appointment booking integration?", a: "I focus on SEO and visibility. Booking integrations are best handled by your web developer, but I can recommend schema and UX improvements that support conversion." }
  - { q: "Do you work with both independent shops and franchises?", a: "Yes. The strategy adapts to single-location independents and multi-location chains, though single-location shops often see the fastest results." }
