intro:
  - "Legal SEO is Local SEO for law firms and individual lawyers: getting your firm's Google Business Profile and practice-area pages in front of people nearby who search for a lawyer by problem, such as divorce, bail, land disputes or company registration, and turning that search into a booked consultation."
  - "Legal searches are high-stakes and personal. People are worried, they want someone qualified and close by, and they read reviews and credentials closely before they call. My [Local SEO service](/local-seo-service) for law firms builds the relevance and trust signals Google looks for, within the advertising rules your bar council or state bar sets."
sections:
  - type: problems
    eyebrow: The problem
    heading: "Why good law firms stay invisible in local search"
    intro: "Legal is competitive and tightly regulated. These are the problems I find most often."
    items:
      - title: "A generic \"Law firm\" listing for everything"
        text: "If your firm mostly handles family law but your profile only says \"Law firm\", you are competing on the broadest term instead of matching \"Divorce lawyer\" or \"Family law attorney\" searches where you'd actually win."
      - title: "Directories outrank your own site"
        text: "Legal directories and lawyer marketplaces often hold the top organic spots for \"lawyer in [city]\". Your own practice-area pages need real depth, and your directory profiles need to match your firm's details exactly."
      - title: "Lawyer and firm profiles competing"
        text: "Each partner may have a practitioner listing alongside the firm's, sometimes with old phone numbers or addresses. Unmanaged, they split reviews and confuse Google about which listing to show."
      - title: "Thin content on a YMYL topic"
        text: "Legal pages are \"Your Money or Your Life\" content. A 200-word page with no named author, no jurisdiction and no real explanation won't rank against firms that show genuine expertise."
  - type: cards
    alt: true
    columns: 3
    eyebrow: What's included
    heading: "What law firm SEO includes"
    intro: "Work begins with [Google Business Profile optimization for law firms](/google-business-profile-optimization), then moves to practice-area pages and the credibility signals that support them."
    items:
      - title: "Profiles set by practice area"
        text: "A primary category matching your main caseload, such as Lawyer, Law firm, Divorce lawyer, Family law attorney, Criminal justice attorney, Immigration attorney or Estate planning attorney, with others added only for areas you actively practise. Consultation booking link, office hours and accurate chamber or office address."
      - title: "Practice-area pages with real depth"
        text: "One page per practice area and, where useful, per common matter: divorce and custody, bail and criminal defence, land and property disputes, company formation, immigration, employment. Each explains the process, documents needed, typical timelines and what a first consultation covers."
      - title: "Lawyer bios and E-E-A-T"
        text: "Named lawyers with enrolment or bar admission, courts they appear in, education and years of practice. Practice-area pages authored or reviewed by the lawyer, which Google and AI answer engines treat as a strong trust signal."
      - title: "LegalService and Attorney schema"
        text: "LocalBusiness markup with the LegalService subtype for the firm and Attorney or Person markup for lawyers, with areaServed, openingHoursSpecification, sameAs links to bar and directory profiles, and FAQPage markup on practice-area pages."
      - title: "Confidential review handling"
        text: "A review request after a matter closes, sent to every client. Replies that thank the reviewer without confirming they were a client or mentioning their case. I also check your jurisdiction's rules on testimonials before anything is published on the website."
      - title: "Photos that build confidence"
        text: "The office or chamber exterior and entrance, meeting room, reception and professional headshots of each lawyer. People booking a consultation want to know who they'll meet and where."
  - type: list
    eyebrow: Search behaviour
    heading: "How people search for a lawyer"
    intro: "Legal searches start with the problem, not the profession. Your pages need to meet people there."
    bullets:
      - "**Problem-led:** \"how to file for divorce in Bangladesh\", \"bail for a family member\", \"land dispute what to do\". Informational pages that answer clearly earn trust and the consultation."
      - "**Practice area plus place:** \"family lawyer in Dhanmondi\", \"criminal lawyer near me\", \"immigration lawyer Chattogram\". These are Map Pack searches where category and distance matter."
      - "**Consultation and cost:** \"free legal consultation\", \"lawyer fees for divorce\", \"consultation fee\". Say clearly how your first consultation works and what it costs."
      - "**Urgent:** \"lawyer for police arrest\", \"emergency bail lawyer\". If you take urgent calls, your hours and phone must say so."
      - "**Terminology:** people in Bangladesh search \"lawyer\", \"advocate\" and the Bangla \"ukil\" interchangeably, often in Banglish. Pages should use all three naturally."
  - type: steps
    eyebrow: Ranking factors
    heading: "What decides law firm rankings"
    intro: "Relevance, distance and prominence, plus the higher trust bar Google applies to legal content."
    items:
      - title: "Practice-area relevance"
        text: "Categories, services and dedicated pages tell Google which legal problems you handle. Specific beats general for almost every firm."
      - title: "Distance to courts and clients"
        text: "Map results lean on proximity. Firms with offices near the courts or business districts their clients use rank best around those areas."
      - title: "Prominence from reviews and citations"
        text: "Reviews, bar association listings, legal directories and local press mentions all add prominence. Consistent firm details across them matter."
      - title: "Expertise signals"
        text: "Author credentials, detailed answers and accurate jurisdiction-specific information help practice-area pages rank and get cited by AI search tools."
  - type: prose
    alt: true
    eyebrow: Proof
    heading: "What this looks like in practice"
    body:
      - "For a law firm, success means consultation calls and booking-link clicks, tracked through GBP Performance and call tracking. I haven't published a legal case study, so here is the method in action on another call-driven business: [461 calls from a Google Business Profile in five months](/case-studies/gbp-calls-growth), up 205% year on year, after category, citation and review fixes."
      - "Law firms often share clients with property professionals, so [real estate SEO](/industries/real-estate-seo) is a natural referral partner for conveyancing and land-dispute work. Every vertical I cover is listed on the [industries hub](/industries). Legal answers are increasingly given by AI tools, and [getting cited by ChatGPT and Gemini](/blog/ai-search-visibility-local-business) depends on the same expertise and consistency signals."
    stat: { value: "+205%", label: "calls year on year in a GBP-led case study" }
