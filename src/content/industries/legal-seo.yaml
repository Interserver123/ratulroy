faqHeading: "Law firm SEO questions"
faqs:
  - q: "How long does SEO take for a law firm?"
    a: "Profile and category fixes can lift visibility within weeks, but practice-area pages in competitive cities usually take 3 to 6 months or more to rank well. Legal is one of the more competitive local niches, so steady work matters more than quick wins."
  - q: "Can individual lawyers have their own Google Business Profile?"
    a: "Yes. Google allows practitioner listings for lawyers who serve clients directly. They can help well-known lawyers, but they need managing so they don't split reviews or show outdated details. A solo practitioner should have one profile, not two."
  - q: "Are client reviews allowed for lawyers?"
    a: "Google reviews from genuine clients are allowed, but your bar council or state bar may restrict how you ask for or use testimonials. In some jurisdictions advocates face strict limits on advertising. I check those rules before setting up any review process."
  - q: "Should I list consultation fees online?"
    a: "If your rules allow it, yes. \"Consultation fee\" and \"free consultation\" are common searches, and clarity helps people decide. Explain what the first meeting covers, which documents to bring and what happens after it, so people arrive prepared."
  - q: "Which Google category should a law firm choose?"
    a: "Choose the category that matches most of your caseload, such as Divorce lawyer or Criminal justice attorney, rather than only the generic Law firm or Lawyer. Add other practice-area categories only for work you actively take on."
