intro:
  - "HVAC SEO is Local SEO for heating, ventilation and air conditioning companies. The aim is simple: your Google Business Profile and website appear in the Map Pack and organic results when people nearby search for AC repair, AC servicing, installation or emergency HVAC help, and those searches turn into booked service calls."
  - "HVAC demand is seasonal and urgent. The AC stops cooling on the hottest week of the year, the homeowner types \"AC repair near me\" or \"AC servicing in Uttara\" on their phone, and they call one of the first three names on the map. My [Local SEO service](/local-seo-service) for HVAC companies is built around that moment: relevance for the exact job, distance to the searcher, and enough prominence to beat the same three competitors who take every call today."
sections:
  - type: problems
    eyebrow: The problem
    heading: "Why HVAC companies lose calls on Google Maps"
    intro: "These are the HVAC ranking problems I find most often in audits, roughly in order of how much they cost."
    items:
      - title: "The wrong primary category"
        text: "Your profile is set to \"Heating contractor\" while 90% of your work is AC repair, or to a generic \"Contractor\". Google uses the primary category as the strongest relevance signal, so the profile never appears for the searches that pay."
      - title: "One page for every service"
        text: "A single \"Our Services\" page cannot rank for AC repair, AC installation, AC gas refill and duct cleaning at the same time. Each job has its own searcher, its own questions and its own price expectations."
      - title: "Keyword-stuffed and lead-gen listings"
        text: "HVAC is full of listings named \"Best AC Repair 24/7 Dhaka\" or virtual-office profiles. They often outrank honest businesses until someone reports them. I help you report genuine spam through Google's redressal form while you build ranking that survives the cleanup."
      - title: "Seasonal swings nobody planned for"
        text: "Searches for AC servicing peak before summer and collapse in winter. If your posts, offers and review requests only start when the phones are already ringing, your competitors have already locked in the top spots."
  - type: cards
    alt: true
    columns: 3
    eyebrow: What's included
    heading: "What HVAC SEO covers, from your Business Profile to your schema"
    intro: "The work starts with [Google Business Profile optimization for HVAC companies](/google-business-profile-optimization), because most HVAC calls come straight from the profile, then moves to the website that backs it up."
    items:
      - title: "Business Profile set up for HVAC"
        text: "Primary category chosen from HVAC contractor, Air conditioning repair service, Air conditioning contractor or Heating contractor based on your revenue mix, with Air duct cleaning service or Furnace repair service added only if you do that work. Services listed one by one, accurate regular and special hours (including Eid closures), and a service area of up to 20 regions."
      - title: "Service pages that match how people search"
        text: "Separate pages for AC repair, AC servicing and cleaning, AC installation, gas refill, duct cleaning, heat pump or furnace work where relevant, and 24-hour emergency service. Each one answers cost, how long the job takes and what the technician checks."
      - title: "Service-area and neighbourhood pages"
        text: "Location pages only for the areas you really serve and want more work in, such as Gulshan, Dhanmondi or Bashundhara R/A, written with local detail instead of a city name swapped into the same template."
      - title: "HVACBusiness schema and technical health"
        text: "LocalBusiness markup using the HVACBusiness subtype, with areaServed, openingHoursSpecification, priceRange and sameAs links to your profiles, plus Service and FAQPage markup. Fast mobile pages with a visible call button, because most HVAC searches happen on a phone."
      - title: "Reviews that mention the job"
        text: "A review link or QR code your technicians share at the end of every visit. A customer who writes \"fixed our split AC in Mirpur the same day\" gives Google a relevance signal no amount of on-page copy can match. No incentives and no filtering out unhappy customers."
      - title: "Photos that prove you do the work"
        text: "Real photos of technicians at work, outdoor units you installed, cleaned coils before and after, and your branded van. Uploaded steadily through the year rather than 40 at once, and never stock images."
  - type: list
    eyebrow: Search behaviour
    heading: "How customers search for HVAC help"
    intro: "HVAC searches fall into a few clear groups. Each one needs a different page and a different call to action."
    bullets:
      - "**Emergency and urgent:** \"AC not cooling\", \"emergency AC repair open now\", \"24 hour HVAC near me\". These searchers call the first credible result, so hours, click-to-call and response time matter most."
      - "**Maintenance:** \"AC servicing near me\", \"AC cleaning service\", \"AC gas refill price\". Lower urgency, very price-aware, and the best source of repeat customers."
      - "**Installation and replacement:** \"split AC installation\", \"inverter AC installation cost\", \"HVAC contractor for office\". Higher-value jobs where reviews and photos of finished work decide the call."
      - "**Cost questions:** \"AC servicing cost in Dhaka\", \"how much is AC gas refill\". A page that gives honest price ranges in BDT (or your local currency) wins the click from a page that hides them."
      - "**Bangla and Banglish:** many people in Bangladesh search \"AC repair\" in English but describe the fault in Bangla or romanised Bangla. Your service pages should answer both."
  - type: steps
    eyebrow: Ranking factors
    heading: "The ranking factors that decide HVAC searches"
    intro: "Google ranks local results on relevance, distance and prominence. Here is what each one means for an HVAC company."
    items:
      - title: "Relevance: category and services"
        text: "\"HVAC contractor\" and \"Air conditioning repair service\" trigger different searches. The right primary category, the right additional categories and a full services list decide which queries you are even eligible for."
      - title: "Distance: service-area reach"
        text: "A service-area business with a hidden address still ranks mostly around its verified location. Reaching outer areas takes neighbourhood pages, local citations and reviews from customers in those areas, measured on a geo-grid."
      - title: "Prominence: review velocity and recency"
        text: "A steady stream of new reviews through the year beats a burst of 50 in one month. Recent reviews that name the service and area carry the most weight."
      - title: "Engagement: calls, clicks and directions"
        text: "Profiles that get chosen keep getting shown. Clear hours, real photos and an obvious call button raise the share of searchers who pick you."
  - type: prose
    alt: true
    eyebrow: Proof
    heading: "What results look like for a call-driven service business"
    body:
      - "I won't promise an HVAC-specific multiplier, because results depend on your market and starting point. What I can show is the same method on a call-driven local service business: [461 calls from one Google Business Profile](/case-studies/gbp-calls-growth) between April and August 2024, up 205% on the same months a year earlier, after category, citation and review fixes."
      - "HVAC sits inside my wider [SEO work for home service businesses](/seo-for-home-services), and it pairs naturally with [plumbing SEO](/industries/plumbing-seo) and [local SEO for electricians](/industries/local-seo-for-electricians): the same homeowners and property managers hire all three trades, often in the same month. For a deeper look at what drives calls in the trades, read [what actually drives calls for home service businesses](/blog/local-seo-for-home-service-businesses)."
    stat: { value: "461", label: "calls from one Business Profile, Apr–Aug 2024" }
