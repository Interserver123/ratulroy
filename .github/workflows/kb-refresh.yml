# Daily refresh of the Messenger assistant's website knowledge base.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SITE_URL     e.g. https://ratulroy.com
#   CRON_SECRET  the same value as the CRON_SECRET secret in Cloudflare Pages
name: Refresh Messenger knowledge base
on:
  schedule:
    - cron: "17 21 * * *" # 03:17 Bangladesh time
  workflow_dispatch: {}
permissions: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Crawl the website in batches
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "::warning::SITE_URL or CRON_SECRET secret missing; skipping"; exit 0; fi
          for i in $(seq 1 40); do
            out=$(curl -sS --retry 3 --retry-delay 5 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/messenger/cron")
            echo "$out"
            status=$(echo "$out" | sed -n 's/.*"status":"\([a-z]*\)".*/\1/p')
            [ "$status" = "running" ] || break
          done
          [ "$status" = "done" ] || { echo "::error::Knowledge base refresh did not finish: $out"; exit 1; }
